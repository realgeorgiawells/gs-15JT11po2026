<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4048"/><stop offset=".5" stop-color="#1f2328"/><stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d98e"/><stop offset=".45" stop-color="#c9a54a"/><stop offset="1" stop-color="#7d5f22"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949c"/><stop offset=".48" stop-color="#f4f6f8"/><stop offset=".52" stop-color="#b9c0c7"/><stop offset="1" stop-color="#5d646b"/>
    </linearGradient>
    <radialGradient id="ball" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#f2f4f6"/><stop offset=".55" stop-color="#b8bec5"/><stop offset="1" stop-color="#5a6168"/>
    </radialGradient>
    <clipPath id="ballclip"><circle cx="0" cy="0" r="118"/></clipPath>
    <style>
      .pent{fill:#23272d;stroke:#16191d;stroke-width:3;stroke-linejoin:round}
      .seam{stroke:#2d3238;stroke-width:3.5;stroke-linecap:round}
    </style>
  </defs>
  
  <g transform="translate(256 262) scale(1.0)">
    <g transform="rotate(-32)">
      <!-- blade (behind the ball, so it enters at the top and leaves at the bottom) -->
      <path d="M-19,-122 L19,-122 L15,190 L0,228 L-15,190 Z" fill="url(#blade)" stroke="#2a2e33" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0,-118 L0,186" stroke="#6b7279" stroke-width="3" opacity=".8"/>
    </g>
    <circle cx="0" cy="0" r="124" fill="#0d0f12" opacity=".35"/>
    <circle cx="0" cy="0" r="118" fill="url(#ball)"/>
    <g clip-path="url(#ballclip)">
      <path d="M0.0,-42.5 L40.4,-13.1 L25.0,34.4 L-25.0,34.4 L-40.4,-13.1 Z" class="pent"/>
      <path d="M0.0,-42.5 L0.0,-77.9" class="seam"/>
      <path d="M0.0,-76.7 L-37.0,-103.6 L-22.9,-147.1 L22.9,-147.1 L37.0,-103.6 Z" class="pent"/>
      <path d="M0.0,-77.9 L62.4,-85.9" class="seam"/>
      <path d="M0.0,-77.9 L-62.4,-85.9" class="seam"/>
      <path d="M40.4,-13.1 L74.1,-24.1" class="seam"/>
      <path d="M72.9,-23.7 L87.1,-67.2 L132.9,-67.2 L147.0,-23.7 L110.0,3.2 Z" class="pent"/>
      <path d="M74.1,-24.1 L101.0,32.8" class="seam"/>
      <path d="M74.1,-24.1 L62.4,-85.9" class="seam"/>
      <path d="M25.0,34.4 L45.8,63.0" class="seam"/>
      <path d="M45.1,62.1 L90.9,62.1 L105.0,105.6 L68.0,132.5 L30.9,105.6 Z" class="pent"/>
      <path d="M45.8,63.0 L0.0,106.2" class="seam"/>
      <path d="M45.8,63.0 L101.0,32.8" class="seam"/>
      <path d="M-25.0,34.4 L-45.8,63.0" class="seam"/>
      <path d="M-45.1,62.1 L-30.9,105.6 L-68.0,132.5 L-105.0,105.6 L-90.9,62.1 Z" class="pent"/>
      <path d="M-45.8,63.0 L-101.0,32.8" class="seam"/>
      <path d="M-45.8,63.0 L0.0,106.2" class="seam"/>
      <path d="M-40.4,-13.1 L-74.1,-24.1" class="seam"/>
      <path d="M-72.9,-23.7 L-110.0,3.2 L-147.0,-23.7 L-132.9,-67.2 L-87.1,-67.2 Z" class="pent"/>
      <path d="M-74.1,-24.1 L-62.4,-85.9" class="seam"/>
      <path d="M-74.1,-24.1 L-101.0,32.8" class="seam"/>
    </g>
    <circle cx="0" cy="0" r="118" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <g transform="rotate(-32)">
      <!-- the cut where the blade enters and leaves -->
      <path d="M-21,-116 L21,-116" stroke="#0d0f12" stroke-width="7" stroke-linecap="round"/>
      <path d="M-17,114 L17,114" stroke="#0d0f12" stroke-width="6" stroke-linecap="round" opacity=".7"/>
      <!-- crossguard, grip and pommel -->
      <path d="M-74,-140 Q-80,-129 -72,-122 L72,-122 Q80,-129 74,-140 Q0,-128 -74,-140 Z" fill="url(#gold)" stroke="#5c4415" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-12" y="-198" width="24" height="60" rx="5" fill="#3b2a18" stroke="#1d140a" stroke-width="2.5"/>
      <path d="M-12,-186 L12,-178 M-12,-172 L12,-164 M-12,-158 L12,-150" stroke="#c9a54a" stroke-width="3"/>
      <circle cx="0" cy="-212" r="17" fill="url(#gold)" stroke="#5c4415" stroke-width="3"/>
      <circle cx="0" cy="-212" r="6" fill="#7d5f22"/>
    </g>
  </g>
</svg>
