<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Goalscraper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goalscraper">
<meta name="theme-color" content="#0f1114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1114; --panel:#181b20; --panel2:#1d2026; --line:#262a31; --line2:#30353d;
  --text:#ece8df; --mute:#9aa0a8; --faint:#6c727a;
  --gold:#c9a54a; --gold-hi:#e8cf86; --gold-lo:#7d5f22;
  --red:#e5484d; --amber:#e0a63a; --green:#4cc38a;
  --engraved:"Cinzel",Georgia,serif; --gothic:"UnifrakturMaguntia",Georgia,serif;
  --plain:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bar:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.4 var(--plain);
  background-image:radial-gradient(ellipse at 50% -15%,rgba(201,165,74,.08),transparent 50%);
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 18px)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit}
/* header */
header{position:sticky;top:0;z-index:15;background:rgba(15,17,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;height:56px}
.hd img{width:34px;height:34px}
.hd h1{margin:0;font:400 28px/1 var(--gothic);flex:1;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.menu-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round}
.mock{font:600 10.5px/1 var(--plain);letter-spacing:.5px;color:#1b1610;background:var(--gold);border-radius:999px;padding:3px 7px;margin-right:4px}
/* section head */
.sh{padding:16px 2px 10px}
.sh h2{margin:0;font:700 15px/1.2 var(--engraved);letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.sh p{margin:4px 0 0;color:var(--mute);font-size:13px}
.sh .meta{margin-top:6px;font-size:12px;color:var(--faint)}
/* list panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.note{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(224,166,58,.35);background:rgba(224,166,58,.07);
  color:#ecd29a;font-size:13px}
.note b{font-family:var(--engraved);letter-spacing:1px;font-size:11.5px}
/* rows */
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--panel2)}
.sc{font:800 19px/1 var(--plain);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.3px}
.sc small{display:block;font:700 9px/1 var(--engraved);letter-spacing:1px;color:var(--faint);margin-top:4px}
.mid{min-width:0}
.teams{font:700 15.5px/1.25 var(--plain);overflow-wrap:anywhere}
.teams .pk{color:var(--gold-hi)}
.teams .v{color:var(--faint);font-weight:500;margin:0 3px}
.sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--faint)}
.sub .tm{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.sub .cp{font:700 10px/1.2 var(--engraved);letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.x{color:var(--red);font-weight:900}
.kf{text-align:right}
.kf b{display:block;font:800 17px/1 var(--plain);font-variant-numeric:tabular-nums}
.kf i{display:block;font-style:normal;font-size:10.5px;color:var(--mute);margin-top:3px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font:600 10.5px/1.5 var(--plain);border:1px solid}
.chip.amber{color:#f2c56b;border-color:rgba(224,166,58,.4);background:rgba(224,166,58,.1)}
.chip.grey{color:var(--mute);border-color:var(--line2)}
.chip.gold{color:var(--gold-hi);border-color:rgba(201,165,74,.45);background:rgba(201,165,74,.08)}
/* details (under the hood) */
.det{display:none;padding:2px 12px 14px 76px;border-top:0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.015))}
.det.open{display:block}
.wdl{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:6px 0 4px;background:var(--line)}
.wdl span:nth-child(1){background:var(--green)}.wdl span:nth-child(2){background:#6c727a}.wdl span:nth-child(3){background:#5b8def}
.wdlk{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.tr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:9px}
.tr .n{font-weight:600;font-size:13.5px}
.rt{display:flex;gap:9px;font-variant-numeric:tabular-nums}
.rt span{min-width:28px;text-align:center;font:800 14px/1 var(--plain)}
.rt i{display:block;font:700 7.5px/1 var(--engraved);font-style:normal;letter-spacing:1px;color:var(--faint);margin-top:3px}
.dl{margin-top:10px;font-size:12.5px;color:#cfcac0;line-height:1.6}
.dl b{font-variant-numeric:tabular-nums}
.gh{padding:8px 12px;font:700 10px/1.2 var(--engraved);letter-spacing:1.6px;color:var(--faint);text-transform:uppercase;border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
.gh:first-child{border-top:0}
.dim .row .teams,.dim .row .kf b{opacity:.85}
/* selected tab */
.count{margin-top:14px;padding:14px;border-radius:14px;border:1px solid rgba(201,165,74,.35);
  background:linear-gradient(180deg,rgba(201,165,74,.10),rgba(201,165,74,.03));text-align:center}
.count .k{font:700 11px/1 var(--engraved);letter-spacing:3px;color:var(--gold)}
.count .t{font:800 40px/1.1 var(--plain);font-variant-numeric:tabular-nums;letter-spacing:1px;margin-top:6px}
.count .g{font-weight:700;font-size:15px;margin-top:4px}
.count .m{font-size:12px;color:var(--mute);margin-top:2px}
.srow{grid-template-columns:52px 1fr}
.srow .ko{font:800 17px/1 var(--plain);font-variant-numeric:tabular-nums;text-align:center}
.srow .ko small{display:block;font:600 10px/1.2 var(--plain);color:var(--faint);margin-top:4px}
.labels{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.fold{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;padding:11px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);cursor:pointer;font:700 11.5px/1 var(--engraved);letter-spacing:2px;color:var(--mute)}
.fold svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.fold.open svg{transform:rotate(180deg)}
/* controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.controls input{grid-column:1/-1}
.controls input,.controls select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line2);background:#121418;color:var(--text);font:inherit;font-size:14px}
.minis{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.mini{font:700 11px/1 var(--plain);padding:4px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.mini i{font-style:normal;font-family:var(--engraved);font-size:9px;letter-spacing:.8px;color:var(--faint);margin-right:4px}
/* record / coverage / how */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font:700 10px/1.2 var(--engraved);letter-spacing:1.6px;color:var(--gold);text-transform:uppercase}
.stat .v{font:800 24px/1.2 var(--plain);font-variant-numeric:tabular-nums;margin-top:4px}
.stat .s{font-size:12px;color:var(--faint)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--mute)}
.log{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:#cfcac0}
.log:first-child{border-top:0}.log small{display:block;color:var(--faint);font-size:11.5px}
.prose{padding:4px 14px 14px;font-size:14px;color:#d6d1c6}
.prose h3{font:700 12px/1.3 var(--engraved);letter-spacing:2px;color:var(--gold);margin:16px 0 4px;text-transform:uppercase}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:none;border:0;color:var(--mute);cursor:pointer;font:700 11px/1 var(--engraved);letter-spacing:2px;padding:6px 0}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
/* menu sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
.scrim.on{display:block}
.sheet{position:fixed;top:calc(env(safe-area-inset-top) + 60px);right:14px;z-index:31;width:240px;display:none;
  background:var(--panel2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.6);overflow:hidden}
.sheet.on{display:block}
.sheet button{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;background:none;border:0;border-top:1px solid var(--line);
  cursor:pointer;text-align:left;font-size:14.5px}
.sheet button:first-child{border-top:0}
.sheet svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* bottom bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom);
  background:#14161a;border-top:1px solid var(--line2)}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--bar)}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  color:var(--faint);font:700 9.5px/1.1 var(--engraved);letter-spacing:.6px;text-transform:uppercase;text-align:center;position:relative;padding:0 2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold-hi)}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.hidden{display:none!important}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;border:1px solid}
.banner b{font-family:var(--engraved);letter-spacing:1px;font-size:11.5px}
.banner.stale{border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.08);color:#f3b9bb}
.banner.new{border-color:rgba(76,195,138,.45);background:rgba(76,195,138,.07);color:#bfead3}
.daystr{font-size:12px;color:var(--faint);padding:8px 2px 0}
.res{font:700 11.5px/1.5 var(--plain);padding:1px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.res.won{color:#7fdcaf;border-color:rgba(76,195,138,.4);background:rgba(76,195,138,.1)}
.res.lost{color:#f3a0a3;border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.1)}
.res.void,.res.pending{color:var(--mute);border-color:var(--line2)}
.cov{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.cov:first-child{border-top:0}
.vb{font:800 12.5px/1 var(--plain);min-width:34px;text-align:center;padding:6px 0;border-radius:8px;background:var(--panel2);color:var(--gold-hi)}
.cov .t{font-weight:600;font-size:14px}.cov .m{font-size:11.5px;color:var(--faint)}
.chip.green{color:#7fdcaf;border-color:rgba(76,195,138,.4);background:rgba(76,195,138,.1)}
.chip.red{color:#f3a0a3;border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.1)}
.subtabs{display:flex;gap:6px;margin:10px 0}
.subtabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--mute);
  font:700 10.5px/1 var(--engraved);letter-spacing:1.4px;cursor:pointer}
.subtabs button.on{color:#1b1610;background:var(--gold);border-color:var(--gold)}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;font:700 13px/1.4 var(--engraved);letter-spacing:2px;color:var(--gold);margin-bottom:6px}

/* record tabs */
.rtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:2px 0 6px}
.rtabs button{padding:8px 2px;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--mute);
  font:700 9.5px/1.25 var(--engraved);letter-spacing:.7px;cursor:pointer;text-transform:uppercase}
.rtabs button.on{color:#1b1610;background:var(--gold);border-color:var(--gold)}
.stat .v.big{font-size:30px}
.stat .wl{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .wl b{color:var(--text)}
.small{font-size:12px;color:var(--faint);padding:8px 2px 0}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 2px 6px}
.dayh b{font:700 11px/1.2 var(--engraved);letter-spacing:1.6px;color:var(--gold);text-transform:uppercase}
.dayh span{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.cov .t .pk{color:var(--gold-hi)}
.bandrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.bandrow:first-child{border-top:0}.bandrow span:first-child{color:var(--mute)}.bandrow .r{font-weight:800;min-width:48px;text-align:right}
/* all results */
.fs{display:inline-block;min-width:38px;text-align:center;margin:0 6px;padding:1px 6px;border-radius:6px;background:#0d0f12;border:1px solid var(--line2);
  font:800 14.5px/1.35 var(--plain);font-variant-numeric:tabular-nums;color:var(--text)}
.mini.pk{border-color:rgba(201,165,74,.7);background:rgba(201,165,74,.12)}
.mini .ok{color:var(--green);margin-left:3px}.mini .no{color:var(--red);margin-left:3px}
.mini.nos{color:var(--faint)}
.rescount{font-size:12px;color:var(--faint);padding:12px 2px 0}
.chk{padding:10px 14px;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .hd2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk .hd2 b{font-size:14px}.chk .hd2 span{font-size:11.5px;color:var(--faint);white-space:nowrap}
.chk .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px}
.chk .c{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 4px;text-align:center;font-variant-numeric:tabular-nums}
.chk .c i{display:block;font:700 8.5px/1.2 var(--engraved);font-style:normal;letter-spacing:.8px;color:var(--faint);text-transform:uppercase}
.chk .c b{font-size:12.5px}.chk .c small{color:var(--faint);font-size:11px}
.chk .c.off{border-color:rgba(224,166,58,.6);background:rgba(224,166,58,.1)}.chk .c.off b{color:#f2c56b}
.chk.overall{background:rgba(201,165,74,.04)}
.fold .rv{color:#f2c56b}
.ft{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header><div class="wrap hd">
  <img src="logo.svg" alt="">
  <h1>Goalscraper</h1>
  <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div></header>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <button data-go="all"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>All games</button>
  <button data-go="comps"><svg viewBox="0 0 24 24"><path d="M6 4h12v4a6 6 0 0 1-12 0V4zM9 20h6M12 14v6M6 6H3a3 3 0 0 0 3 4M18 6h3a3 3 0 0 1-3 4"/></svg>By competition</button>
  <button data-go="record"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Record</button>
  <button data-go="coverage"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Coverage</button>
  <button data-go="how"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>How it works</button>
</div>

<div class="wrap" id="banners"></div>
<main class="wrap" id="main"><div class="empty"><b>LOADING</b></div></main>

<nav aria-label="Sections"><div class="in">
  <button data-tab="selected"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Selected</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 7V3.5M16 10l3.4-1.2M14.5 14.5l2 3M9.5 14.5l-2 3M8 10L4.6 8.8"/></svg>Easy Goals</button>
  <button data-tab="misses"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>Misses</button>
  <button data-tab="ballon"><svg viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 4M16 5h3a3 3 0 0 1-3 4M12 12v4M9 20h6M10 16h4"/></svg>Ballon d'Or</button>
  <button data-tab="btts"><svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 15z"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/></svg>Raining Goals</button>
</div></nav>

<script>
(function(){
"use strict";
let D = null, COV = null, REC = null, RIDX = null;
const MONTHS = {};
const TZ = "Europe/Dublin";
async function getJSON(name){
  try { const r = await fetch(`data/${name}?v=${Date.now()}`, {cache: "no-store"}); if (r.ok) return await r.json(); } catch (e) {}
  return (window.__GS__ || {})[name.replace(".json", "")] || null;   // preview pages carry their data inline
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const hue = v => { const t = Math.max(0, Math.min(1, (v - 1) / 99)); return `hsl(${Math.round(t * 128)} 70% ${52 + Math.sin(t * Math.PI) * 6}%)`; };
const tm = ts => new Intl.DateTimeFormat("en-IE", {timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false}).format(new Date(ts * 1000));
const now = () => Date.now() / 1000;
const ago = s => { const m = Math.floor(s / 60); return m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };
const odds = p => { const f = 1 / p - 1; return f >= 1 ? `${Math.round(f)}/1` : `1/${Math.round(1 / f)}`; };

const SEC = {
  goals:  {name: "Easy Goals",   blurb: () => `Games most likely to have at least one goal.`,
           fig: g => [pct(1 - g.p00, 1), "1+ goals"]},
  misses: {name: "Misses",       blurb: () => `Teams most likely not to win (lose or draw). Any game except Ballon d'Or picks.`,
           fig: g => [pct(g.sec.misses.p, 0), "not to win"]},
  ballon: {name: "Ballon d'Or",  blurb: () => `Clear favourites (${Math.round(D.ballon_min * 100)}% or more to win), most likely first.`,
           fig: g => [pct(g.sec.ballon.p, 0), "to win"]},
  btts:   {name: "Raining Goals",blurb: () => "Games most likely to see both teams score.",
           fig: g => [pct(g.p_btts, 0), "both score"]},
};
/* the app shows one Irish day at a time: today's picks, switching to the next day at midnight */
const gameDay = g => g.day || new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(new Date(g.ts * 1000));
const today = () => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(new Date(Date.now() + 10 * 60000));   // next day's picks from 23:50
const dayGames = () => D.games.filter(g => gameDay(g) === today());
const todayName = () => new Intl.DateTimeFormat("en-IE", {timeZone: "UTC", weekday: "long", day: "numeric", month: "long"}).format(new Date(today() + "T12:00:00Z"));
const kicked = g => g.ts <= now() || g.tags.includes("postponed") || !!g.result;
/* pass marks per section: [club, international now, international target] */
const passOf = key => (D.pass && D.pass[key]) || [D.min_club, D.min_intl, D.min_intl_end || D.min_club];
const picks = key => dayGames().filter(g => g.sec[key].pick).sort((a, b) => a.sec[key].rank - b.sec[key].rank);
const teamOf = (g, key) => g[g.sec[key].team].name;

const OPEN = new Set();
/* ---------- pieces ---------- */
function chips(g, key){
  const o = [];
  if (g.tags.includes("postponed")) o.push(`<span class="chip red">Postponed</span>`);
  if (g.tags.includes("limited_data")) o.push(`<span class="chip amber">Limited data</span>`);
  if (g.tags.includes("time_tbc")) o.push(`<span class="chip grey">Time TBC</span>`);
  if (g.tags.includes("too_short") && (!key || key === "all")) o.push(`<span class="chip grey">Goals too short</span>`);
  if (g.intl) o.push(`<span class="chip grey">International</span>`);
  return o.join("");
}
function teamsLine(g, key){
  const pk = key === "misses" || key === "ballon" ? g.sec[key].team : null;
  const n = side => `<span class="${pk === side ? "pk" : ""}">${esc(g[side].name)}</span>`;
  return `${n("home")}<span class="v">v</span>${n("away")}`;
}
function subLine(g, key){
  const st = now() >= g.ts && !g.tags.includes("postponed");
  const done = g.result ? `<span class="x">✕</span><span class="ft">FT ${g.result[0]}–${g.result[1]}</span>` : st ? `<span class="x">✕</span><span>${ago(now() - g.ts)}</span>` : "";
  return `<span class="tm">${tm(g.ts)}</span>${done}<span>·</span><span class="cp">${esc(g.comp)}</span>${chips(g, key)}`;
}
function rates(t){
  const c = v => `style="color:${hue(v)}"`;
  return `<div class="rt"><span ${c(t.ovr)}>${t.ovr}<i>OVR</i></span><span ${c(t.att)}>${t.att}<i>ATT</i></span><span ${c(t.def)}>${t.def}<i>DEF</i></span></div>`;
}
function details(g, key){
  const extra = {
    goals: `Chance of 0-0 <b>${pct(g.p00, 1)}</b>`,
    misses: `${esc(teamOf(g, "misses"))} to lose or draw <b>${pct(g.sec.misses.p, 1)}</b> · model price for them to win about <b>${odds(1 - g.sec.misses.p)}</b>`,
    ballon: `${esc(teamOf(g, "ballon"))} to win <b>${pct(g.sec.ballon.p, 1)}</b> · model price about <b>${odds(g.sec.ballon.p)}</b>`,
    btts: `${esc(g.home.name)} score <b>${pct(g.p_home_score)}</b> · ${esc(g.away.name)} score <b>${pct(g.p_away_score)}</b>`,
  }[key] || "";
  return `<div class="det ${OPEN.has(key + "-" + g.fid) ? "open" : ""}" data-det="${key}-${g.fid}">
    <div class="wdl"><span style="width:${g.pw_home * 100}%"></span><span style="width:${g.pd * 100}%"></span><span style="width:${g.pw_away * 100}%"></span></div>
    <div class="wdlk"><span>${esc(g.home.name)} ${pct(g.pw_home)}</span><span>Draw ${pct(g.pd)}</span><span>${esc(g.away.name)} ${pct(g.pw_away)}</span></div>
    <div class="tr"><div class="n">${esc(g.home.name)}</div>${rates(g.home)}</div>
    <div class="tr"><div class="n">${esc(g.away.name)}</div>${rates(g.away)}</div>
    <div class="dl">${extra}<br>Expected goals <b>${g.xg_home.toFixed(2)} – ${g.xg_away.toFixed(2)}</b> · ${esc(g.round)}${g.tags.includes("limited_data") ? "<br>Limited data: few results for at least one team, so the score is trimmed slightly." : ""}</div>
  </div>`;
}
function pickRow(g, key){
  const s = g.sec[key], [v, l] = SEC[key].fig(g);
  return `<div class="row" data-open="${key}-${g.fid}">
    <div class="sc" style="color:${hue(s.score)}">${s.score.toFixed(1)}<small>#${s.rank}${s.exceptional && s.pick ? ` <b style="color:var(--gold-hi)">★</b>` : ""}${page === "comps" && s.pick ? `<br><b style="color:var(--gold-hi)">PICK</b>` : ""}</small></div>
    <div class="mid"><div class="teams">${teamsLine(g, key)}</div><div class="sub">${subLine(g, key)}</div></div>
    <div class="kf"><b>${v}</b><i>${l}</i></div></div>${details(g, key)}`;
}

/* ---------- next best (below the picks) ---------- */
const nextOpen = {};
function nextBest(key){
  const rest = dayGames().filter(g => g.sec[key].listed !== false && !g.sec[key].pick && !kicked(g)).sort((a, b) => a.sec[key].rank - b.sec[key].rank);
  if (!rest.length) return "";
  const [pc, pi] = passOf(key);
  const passed = rest.filter(g => g.sec[key].score >= (g.intl ? pi : pc));
  const below = rest.filter(g => g.sec[key].score < (g.intl ? pi : pc));
  let h = `<button class="fold ${nextOpen[key] ? "open" : ""}" data-next="${key}"><span>NEXT BEST (${rest.length})</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;
  if (nextOpen[key]) {
    h += `<div class="panel dim" style="margin-top:8px">`;
    if (passed.length) h += `<div class="gh">Passed the mark</div>` + passed.map(g => pickRow(g, key)).join("");
    if (below.length) h += `<div class="gh">Below the pass mark: not picks</div>` + below.map(g => pickRow(g, key)).join("");
    h += `</div>`;
  }
  return h;
}

/* ---------- views ---------- */
const kickOpen = {};
function sectionView(key){
  const all = picks(key), S = SEC[key], list = all.filter(g => !kicked(g)), done = all.filter(kicked);
  let h = `<div class="sh"><h2>${S.name}</h2><p>${S.blurb()}</p>
    <div class="meta">${todayName()} · ${all.length} pick${all.length === 1 ? "" : "s"}${done.length ? ` (${done.length} kicked off)` : ""} · minimum score ${passOf(key)[0]} (internationals ${passOf(key)[1]}${passOf(key)[1] < passOf(key)[2] ? `, rising to ${passOf(key)[2]}` : ""}) · tap a game for details</div></div>`;
  if (!all.length) h += `<div class="note"><b>NO PICKS TODAY</b> &nbsp;No games today reached the minimum score.</div>`;
  else if (!list.length) h += `<div class="note"><b>ALL KICKED OFF</b> &nbsp;Today's picks have all started; they're below. Tomorrow's appear at 23:50.</div>`;
  else h += `<div class="panel">${list.map(g => pickRow(g, key)).join("")}</div>`;

  h += nextBest(key);
  if (done.length) {
    h += `<button class="fold ${kickOpen[key] ? "open" : ""}" data-kick="${key}"><span>ALREADY KICKED OFF (${done.length})</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;
    if (kickOpen[key]) h += `<div class="panel" style="margin-top:8px">${done.map(g => pickRow(g, key)).join("")}</div>`;
  }
  return h;
}
function selectedGames(){
  const m = new Map();
  for (const key of ["goals", "misses", "ballon"]) for (const g of picks(key)) {
    if (!m.has(g.fid)) m.set(g.fid, {g, labels: []});
    const lab = key === "goals" ? `Easy Goals #${g.sec.goals.rank}` :
      `${SEC[key].name} #${g.sec[key].rank} · ${teamOf(g, key)}`;
    m.get(g.fid).labels.push(lab);
  }
  return [...m.values()].sort((a, b) => a.g.ts - b.g.ts);
}
function selRow({g, labels}){
  return `<div class="row srow" data-open="sel-${g.fid}">
    <div class="ko">${tm(g.ts)}${g.result ? `<small class="x">✕ <span class="ft">FT ${g.result[0]}–${g.result[1]}</span></small>` : now() >= g.ts && !g.tags.includes("postponed") ? `<small class="x">✕ ${ago(now() - g.ts)}</small>` : ""}</div>
    <div class="mid"><div class="teams">${esc(g.home.name)}<span class="v">v</span>${esc(g.away.name)}</div>
      <div class="sub"><span class="cp">${esc(g.comp)}</span>${chips(g, "sel")}</div>
      <div class="labels">${labels.map(l => `<span class="chip gold">${esc(l)}</span>`).join("")}</div></div></div>${details(g, "sel")}`;
}
let foldOpen = false;
function selectedView(){
  const pp = x => x.g.tags.includes("postponed") || !!x.g.result;
  const all = selectedGames(), up = all.filter(x => x.g.ts > now() && !pp(x)), st = all.filter(x => x.g.ts <= now() || pp(x));
  let h = `<div class="sh"><h2>Selected games</h2><p>Today's picks from Easy Goals, Misses and Ballon d'Or, in kickoff order.</p><div class="meta">${todayName()}</div></div>`;
  if (up.length) {
    const n = up[0].g;
    h += `<div class="count"><div class="k">NEXT KICK-OFF</div><div class="t" id="cd">--:--:--</div>
      <div class="g">${esc(n.home.name)} v ${esc(n.away.name)}</div><div class="m">${tm(n.ts)} · ${esc(n.comp)}</div></div>`;
  }
  h += `<div class="sh" style="padding-top:14px"><div class="meta">${up.length} to come · ${st.length} already started${st.some(x => x.g.tags.includes("postponed")) ? " or postponed" : ""}${D.updated_utc ? ` · results updated ${tm(Date.parse(D.updated_utc) / 1000)}` : ""}</div></div>`;
  h += up.length ? `<div class="panel">${up.map(selRow).join("")}</div>` : all.length ? `<div class="note"><b>ALL STARTED</b> &nbsp;Every selected game today has kicked off. Tomorrow's appear at 23:50.</div>` : `<div class="note"><b>NO PICKS TODAY</b></div>`;
  if (st.length) {
    h += `<button class="fold ${foldOpen ? "open" : ""}" id="fold"><span>ALREADY STARTED${st.some(x => x.g.tags.includes("postponed")) ? " / POSTPONED" : ""} (${st.length})</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;
    if (foldOpen) h += `<div class="panel" style="margin-top:8px">${st.map(selRow).join("")}</div>`;
  }
  return h;
}
/* ---------- by competition: best 5 Easy Goals and best 3 Raining Goals in each competition, per day ---------- */
let compDay = null, compSel = "";
function compsView(){
  if (!compDay || compDay < today()) compDay = today();
  const days = [...new Set(D.games.map(gameDay))].sort().filter(d => d >= today());
  const games = D.games.filter(g => gameDay(g) === compDay);
  const comps = [...new Set(games.map(g => g.comp))].sort();
  if (compSel && !comps.includes(compSel)) compSel = "";
  let h = BACK + `<div class="sh"><h2>By competition</h2><p>The best 5 Easy Goals and best 3 Raining Goals games in each competition, whether or not they made the main lists.</p></div>
    <div class="controls"><select id="cday">${days.map(d => `<option value="${d}" ${d === compDay ? "selected" : ""}>${d === today() ? "Today" : esc(new Intl.DateTimeFormat("en-IE", {timeZone: "UTC", weekday: "long", day: "numeric", month: "short"}).format(new Date(d + "T12:00:00Z")))}</option>`).join("")}</select>
    <select id="ccomp"><option value="">All ${comps.length} competitions</option>${comps.map(c => `<option ${c === compSel ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>`;
  const list = compSel ? [compSel] : comps;
  if (!list.length) return h + `<div class="empty"><b>NO GAMES</b>Nothing scored for this day.</div>`;
  for (const c of list) {
    const cg = games.filter(g => g.comp === c);
    const eg = cg.filter(g => g.sec.goals.listed).sort((a, b) => b.sec.goals.score - a.sec.goals.score).slice(0, 5);
    const rg = [...cg].sort((a, b) => b.sec.btts.score - a.sec.btts.score).slice(0, 3);
    h += `<div class="dayh"><b>${esc(c)}</b><span>${cg.length} game${cg.length === 1 ? "" : "s"}</span></div><div class="panel">`;
    h += `<div class="gh">Easy Goals</div>` + (eg.length ? eg.map(g => pickRow(g, "goals")).join("") : `<div class="log">No games here (all too short or too risky).</div>`);
    h += `<div class="gh">Raining Goals</div>` + rg.map(g => pickRow(g, "btts")).join("") + `</div>`;
  }
  return h;
}
let allDay = null;
function allView(){
  if (!allDay || allDay < today()) allDay = today();
  const comps = [...new Set(D.games.map(g => g.comp))].sort();
  return `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>
    <div class="sh"><h2>All games</h2><p>Every game scored for today and tomorrow, with its score in each section.</p></div>
    <div class="controls"><select id="dy">${[...new Set(D.games.map(gameDay))].sort().filter(d => d >= today()).map(d => `<option value="${d}" ${d === allDay ? "selected" : ""}>${d === today() ? "Today" : esc(new Intl.DateTimeFormat("en-IE", {timeZone: "UTC", weekday: "long", day: "numeric", month: "short"}).format(new Date(d + "T12:00:00Z")))}</option>`).join("")}</select><input id="q" placeholder="Search team or competition"><select id="fc"><option value="">All competitions</option>${comps.map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <select id="so"><option value="ko">Sort: kickoff</option><option value="goals">Sort: Easy Goals</option><option value="btts">Sort: Raining Goals</option></select></div>
    <div class="panel" id="allList"></div>`;
}
function allRows(){
  const q = ($("#q")?.value || "").toLowerCase(), fc = $("#fc")?.value || "", so = $("#so")?.value || "ko";
  let l = D.games.filter(g => gameDay(g) === allDay && (!fc || g.comp === fc) && (g.home.name + " " + g.away.name + " " + g.comp).toLowerCase().includes(q));
  l.sort((a, b) => so === "ko" ? a.ts - b.ts : b.sec[so].score - a.sec[so].score);
  const mini = (lab, v) => `<span class="mini" style="color:${hue(v)}"><i>${lab}</i>${v.toFixed(0)}</span>`;
  $("#allList").innerHTML = l.map(g => {
    const w = g.sec.ballon.pick ? ["BD", g.sec.ballon.score] : g.sec.misses.rank != null ? ["MI", g.sec.misses.score] : g.sec.ballon.listed ? ["BD", g.sec.ballon.score] : null;
    return `<div class="row srow" data-open="all-${g.fid}"><div class="ko">${tm(g.ts)}${now() >= g.ts ? `<small class="x">✕</small>` : ""}</div>
      <div class="mid"><div class="teams">${esc(g.home.name)}<span class="v">v</span>${esc(g.away.name)}</div>
      <div class="sub"><span class="cp">${esc(g.comp)}</span>${chips(g)}</div>
      <div class="minis">${g.sec.goals.listed ? mini("EG", g.sec.goals.score) : `<span class="mini"><i>EG</i>short</span>`}${w ? mini(w[0], w[1]) : ""}${mini("RG", g.sec.btts.score)}</div></div></div>${details(g, "all")}`;
  }).join("");
}
const SECNAME = {goals: "Easy Goals", misses: "Misses", ballon: "Ballon d'Or", btts: "Raining Goals"};
const SHORT = {goals: "EG", misses: "MI", ballon: "BD", btts: "RG"};
let compOpen = false, chkOpen = false, recTab = "goals", recDays = 7, resMine = true, resDate = "3", resComp = "", resQ = "";
const dayName = d => new Intl.DateTimeFormat("en-IE", {timeZone: "UTC", weekday: "long", day: "numeric", month: "long"}).format(new Date(d + "T12:00:00Z"));
const dayShort = d => new Intl.DateTimeFormat("en-IE", {timeZone: "UTC", weekday: "short", day: "numeric", month: "short"}).format(new Date(d + "T12:00:00Z"));
const monthName = m => new Intl.DateTimeFormat("en-IE", {timeZone: "UTC", month: "long", year: "numeric"}).format(new Date(m + "-15T12:00:00Z"));
const dayOf = t => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(new Date(t * 1000));
const rate = s => { const n = s.won + s.lost; return n ? (s.won / n * 100).toFixed(1) + "%" : "–"; };
const BACK = `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>`;
const fold = (attr, open, label) => `<button class="fold ${open ? "open" : ""}" ${attr}><span>${label}</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;

function recordView(){
  let h = BACK + `<div class="sh"><h2>Record</h2><p>How Goalscraper's picks have done, and every result it has stored. Results come in at about 6 pm and 6:15 am.</p></div>
    <div class="rtabs">${[["goals", "Easy<br>Goals"], ["misses", "Misses"], ["ballon", "Ballon<br>d'Or"], ["btts", "Raining<br>Goals"], ["all", "All<br>results"]]
      .map(([k, l]) => `<button data-rt="${k}" class="${recTab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  if (recTab === "all") return h + resultsView();
  if (!REC) return h + `<div class="empty"><b>NO RECORD YET</b>Picks are settled once their games have finished.</div>`;
  return h + recSection(recTab);
}
function recSection(key){
  const S = REC.sections[key];
  const card = (title, s) => `<div class="stat"><div class="k">${title}</div><div class="v big" style="color:${s.won + s.lost ? hue(s.won / (s.won + s.lost) * 100) : "var(--mute)"}">${rate(s)}</div>
    <div class="wl"><b>${s.won}</b> won · <b>${s.lost}</b> lost${s.void ? ` · ${s.void} void` : ""}</div></div>`;
  let h = `<div class="stats">${card("Last 30 days", S.d30)}${card("All time", S.all)}</div>`;
  const extra = [];
  if (S.pending) extra.push(`${S.pending} pick${S.pending === 1 ? "" : "s"} waiting for results`);
  if (S.v1) extra.push(`${S.v1} first-version pick${S.v1 === 1 ? "" : "s"} shown below but not counted`);
  if (extra.length) h += `<div class="small">${extra.join(" · ")}</div>`;
  if ((S.bands || []).length) {
    h += `<div class="sh" style="padding-bottom:6px"><h2 style="font-size:12px">By score</h2><p>Do higher scores win more often? All time.</p></div><div class="panel">` +
      S.bands.map(b => `<div class="bandrow"><span>${esc(b.label)}</span><span>${b.won} won · ${b.lost} lost</span><span class="r" style="color:${hue(b.won / Math.max(1, b.won + b.lost) * 100)}">${rate(b)}</span></div>`).join("") + `</div>`;
  }
  if ((S.comps || []).length) {
    const tot = S.all.won + S.all.lost, avg = tot ? S.all.won / tot : 0;
    h += fold("data-comp", compOpen, `BY COMPETITION (${S.comps.length})`);
    if (compOpen) h += `<div class="small">All time, most picks first. <span class="chip amber">Below average</span> marks a competition with 5+ picks doing noticeably worse than this section overall (${rate(S.all)}).</div><div class="panel" style="margin-top:8px">` +
      S.comps.map(c => { const n = c.won + c.lost, r = n ? c.won / n : 0, weak = n >= 5 && r < avg - 0.1;
        return `<div class="bandrow"><span>${esc(c.comp)}${weak ? ` <span class="chip amber">Below average</span>` : ""}${n < 5 ? ` <span class="chip grey">Few picks</span>` : ""}</span><span>${c.won} won · ${c.lost} lost</span><span class="r" style="color:${n ? hue(r * 100) : "var(--mute)"}">${rate(c)}</span></div>`; }).join("") + `</div>`;
  }
  const days = REC.days.map(d => ({date: d.date, picks: d.picks.filter(p => p.section === key && p.res !== "pending")})).filter(d => d.picks.length);
  if (!days.length) return h + `<div class="empty"><b>NOTHING SETTLED YET</b>Picks appear here once their games have finished.</div>`;
  for (const d of days.slice(0, recDays)) {
    const w = d.picks.filter(p => p.res === "won" && !p.v1).length, n = d.picks.filter(p => p.res !== "void" && !p.v1).length;
    h += `<div class="dayh"><b>${esc(dayName(d.date))}</b><span>${n ? `${w} of ${n} won` : "not counted"}</span></div><div class="panel">` + d.picks.map(p => {
      const nm = side => { const t = esc(side === "home" ? p.h : p.a); return p.team === side ? `<span class="pk">${t}</span>` : t; };
      const who = esc(p.team === "home" ? p.h : p.a);
      const what = key === "misses" ? ` · ${who} not to win` : key === "ballon" ? ` · ${who} to win` : "";
      const res = p.res === "void" ? "Void" : `${p.result[0]}–${p.result[1]} ${p.res === "won" ? "✓" : "✕"}`;
      return `<div class="cov"><div class="vb" style="color:${hue(p.score)}">${Math.round(p.score)}</div>
        <div><div class="t">${nm("home")} v ${nm("away")}</div><div class="m">${p.rank ? `#${p.rank}` : ""}${what} · ${esc(p.comp)}${p.v1 ? ` <span class="chip grey">First version</span>` : ""}</div></div>
        <span class="res ${p.res}">${res}</span></div>`; }).join("") + `</div>`;
  }
  if (days.length > recDays) h += fold("data-older", false, `SHOW OLDER (${days.length - recDays} MORE DAY${days.length - recDays === 1 ? "" : "S"})`);
  return h;
}

/* ---------- all results ---------- */
function resultsView(){
  if (!RIDX) return `<div class="empty"><b>NO RESULTS YET</b>Results appear after the next run.</div>`;
  const recent = RIDX.days.slice(0, 30), covered = new Set(recent.map(d => d.slice(0, 7)));
  const dOpts = [["3", "Last 3 days"], ["7", "Last 7 days"], ["30", "Last 30 days"], ...recent.map(d => [d, dayShort(d)]),
    ...RIDX.months.filter(m => !covered.has(m) || m < recent[recent.length - 1]?.slice(0, 7)).map(m => ["m:" + m, monthName(m)])];
  return `<div class="subtabs" style="margin-top:4px"><button data-rm="1" class="${resMine ? "on" : ""}">YOUR COMPETITIONS</button><button data-rm="0" class="${resMine ? "" : "on"}">EVERYTHING</button></div>
    <div class="controls"><input id="rq" placeholder="Search team or competition" value="${esc(resQ)}">
    <select id="rc"><option value="">All competitions</option></select>
    <select id="rd">${dOpts.map(([v, l]) => `<option value="${v}" ${v === resDate ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
    ${checkFold()}<div class="rescount" id="rcount"></div><div id="resList"><div class="empty"><b>LOADING</b></div></div>`;
}
function checkFold(){
  const C = RIDX && RIDX.check; if (!C || !C.rows.length) return "";
  const rv = C.rows.filter(r => r.review).length;
  let h = fold("data-chk", chkOpen, `MODEL CHECK${rv ? ` · <span class="rv">${rv} TO REVIEW</span>` : ""}`);
  if (!chkOpen) return h;
  const L = {p00: "0-0", draw: "Draws", home: "Home wins", btts: "Both score"};
  const rows = C.rows.filter(r => !resComp || r.overall || r.comp === resComp)
    .sort((a, b) => (b.overall - a.overall) || (b.review - a.review) || (b.n - a.n));
  h += `<div class="small">Every game Goalscraper rated in the last ${C.days} days, not just picks. Forecast → actual, per 100 games. <span class="chip amber">Review</span> means a gap too big to be bad luck, so the model may be off there. Under ${C.min_games} games isn't flagged.</div><div class="panel" style="margin-top:8px">` +
    rows.map(r => `<div class="chk ${r.overall ? "overall" : ""}"><div class="hd2"><b>${esc(r.comp)} ${r.review ? `<span class="chip amber">Review</span>` : ""}${r.n < C.min_games ? `<span class="chip grey">Few games</span>` : ""}</b><span>${r.n} games</span></div>
      <div class="g4">${Object.entries(L).map(([k, l]) => { const m = r.m[k]; return `<div class="c ${m.off ? "off" : ""}"><i>${l}</i><small>${m.f.toFixed(0)} → </small><b>${m.a.toFixed(0)}</b></div>`; }).join("")}</div></div>`).join("") + `</div>`;
  return h;
}
async function loadMonth(m){
  if (MONTHS[m]) return MONTHS[m];
  const raw = (await getJSON(`results/${m}.json`)) || [];
  return MONTHS[m] = raw.map(g => ({fid: g.id, ts: g.t, comp: g.c, mine: !!g.m, h: g.h, a: g.a, r: g.r, v1: g.v1,
    s: g.s ? Object.fromEntries(Object.entries(g.s).map(([k, v]) => [k, {score: v[0], rank: v[1], pick: !!v[2], team: v[3], listed: v[1] != null}])) : null}));
}
let resSeq = 0;
async function resRows(){
  const seq = ++resSeq, list = $("#resList"); if (!list || !RIDX) return;
  let days = null, months;
  if (resDate.startsWith("m:")) months = [resDate.slice(2)];
  else {
    days = /^\d+$/.test(resDate) ? RIDX.days.slice(0, +resDate) : [resDate];
    months = [...new Set(days.flatMap(d => { const m = d.slice(0, 7), prev = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 2, 15)).toISOString().slice(0, 7);
      return d.endsWith("-01") ? [m, prev] : [m]; }))].filter(m => RIDX.months.includes(m));
  }
  const all = (await Promise.all(months.map(loadMonth))).flat();
  if (seq !== resSeq) return;
  const inRange = all.filter(g => (!resMine || g.mine) && (!days || days.includes(dayOf(g.ts))));
  const sel = $("#rc"), comps = [...new Set(inRange.map(g => g.comp))].sort();
  if (resComp && !comps.includes(resComp)) comps.unshift(resComp);
  sel.innerHTML = `<option value="">All competitions</option>` + comps.map(c => `<option ${c === resComp ? "selected" : ""}>${esc(c)}</option>`).join("");
  const q = resQ.toLowerCase();
  const l = inRange.filter(g => (!resComp || g.comp === resComp) && (g.h + " " + g.a + " " + g.comp).toLowerCase().includes(q)).sort((a, b) => b.ts - a.ts);
  const picks = l.filter(g => g.s && Object.values(g.s).some(v => v.pick)).length;
  $("#rcount").textContent = `${l.length} result${l.length === 1 ? "" : "s"} · ${picks} with picks · gold = a Goalscraper pick`;
  const mini = (k, v, g) => {
    if (!v.listed) return k === "goals" ? `<span class="mini"><i>EG</i>short</span>` : "";
    if (!v.pick) return `<span class="mini" style="color:${hue(v.score)}"><i>${SHORT[k]}</i>${Math.round(v.score)}</span>`;
    const ok = g.r && (k === "goals" ? g.r[0] + g.r[1] > 0 : k === "btts" ? g.r[0] > 0 && g.r[1] > 0 :
      (k === "misses") !== (v.team === "home" ? g.r[0] > g.r[1] : g.r[1] > g.r[0]));
    return `<span class="mini pk" style="color:${hue(v.score)}"><i>${SHORT[k]}</i>${Math.round(v.score)}${!g.r ? "" : ok ? `<span class="ok">✓</span>` : `<span class="no">✕</span>`}</span>`;
  };
  const shown = l.slice(0, 400);
  let h = "", cur = "";
  for (const g of shown) {
    const d = dayOf(g.ts);
    if (d !== cur) { h += (cur ? `</div>` : "") + `<div class="dayh"><b>${esc(dayName(d))}</b><span>${l.filter(x => dayOf(x.ts) === d).length} results</span></div><div class="panel">`; cur = d; }
    const sc = g.r ? `<span class="fs">${g.r[0]}–${g.r[1]}</span>` : `<span class="fs" style="color:var(--mute)">–</span>`;
    const minis = !g.s ? (g.mine ? "" : `<span class="mini nos">Not one of your competitions</span>`) :
      ["goals", "misses", "ballon", "btts"].filter(k => g.s[k]).map(k => mini(k, g.s[k], g)).join("");
    h += `<div class="row srow"><div class="ko">${tm(g.ts)}</div><div class="mid"><div class="teams">${esc(g.h)}${sc}${esc(g.a)}</div>
      <div class="sub"><span class="cp">${esc(g.comp)}</span>${g.v1 ? `<span class="chip grey">First version</span>` : ""}</div>${minis ? `<div class="minis">${minis}</div>` : ""}</div></div>`;
  }
  if (l.length > shown.length) h += `</div><div class="note"><b>SHOWING 400 OF ${l.length}</b> &nbsp;Narrow it down with search, a competition or a single day.`;
  list.innerHTML = l.length ? h + `</div>` : `<div class="empty"><b>NO RESULTS</b>Nothing matches these filters.</div>`;
}
const STATUS = {covered: ["green", "Covered"], partial: ["amber", "Partly covered"], no_games: ["grey", "No games"],
  omitted_budget: ["amber", "Omitted: request limit"], blocked_plan: ["red", "Blocked"], error: ["red", "Error"],
  not_available: ["grey", "Not on free plan"], results_only: ["amber", "Results only"], switched_off: ["grey", "Switched off"]};
let covProblems = false;
function coverageView(){
  const back = `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>`;
  if (!COV) return back + `<div class="empty"><b>NO REPORT YET</b></div>`;
  const comps = COV.competitions || [], cnt = {};
  comps.forEach(c => cnt[c.status] = (cnt[c.status] || 0) + 1);
  const ran = COV.generated_utc ? new Date(COV.generated_utc).toLocaleString("en-IE", {timeZone: TZ, dateStyle: "medium", timeStyle: "short"}) : "–";
  let h = back + `<div class="sh"><h2>Coverage</h2><p>This morning's run and what the model has changed.</p></div>
    <div class="panel"><div class="kv"><span>Last run</span><b>${esc(ran)}</b></div>
    <div class="kv"><span>Games scored</span><b>${COV.games_scored ?? "–"}</b></div>
    <div class="kv"><span>Requests used · left this month</span><b>${COV.requests_used} · ${COV.monthly_remaining ?? "–"}</b></div>
    <div class="kv"><span>Competitions with games</span><b>${(cnt.covered || 0) + (cnt.partial || 0)} of ${comps.length}</b></div>
    <div class="kv"><span>Not on free plan</span><b>${cnt.not_available || 0}</b></div>
    <div class="kv"><span>Problems</span><b>${(cnt.omitted_budget || 0) + (cnt.blocked_plan || 0) + (cnt.error || 0)}</b></div>
    ${COV.evening ? `<div class="kv"><span>Evening update</span><b>${esc(new Date(COV.evening.at).toLocaleString("en-IE", {timeZone: TZ, dateStyle: "medium", timeStyle: "short"}))} · ${COV.evening.requests_used} requests</b></div>` : ""}
    ${COV.evening && COV.evening.error ? `<div class="kv"><span>Evening problem</span><b style="color:var(--red)">${esc(COV.evening.error)}</b></div>` : ""}
    ${COV.model && COV.model.intl_pass ? `<div class="kv"><span>International pass mark</span><b>${COV.model.intl_pass.value}${COV.model.intl_pass.value < COV.model.intl_pass_end ? ` · ${COV.model.intl_pass.paused ? "rise paused (model check)" : `next point at ${COV.model.intl_pass.next_at} games`} (${COV.model.intl_pass.games} so far)` : ""}</b></div>` : ""}
    ${COV.thesportsdb && COV.thesportsdb.requests ? `<div class="kv"><span>Games from TheSportsDB</span><b>${COV.thesportsdb.games} added${COV.thesportsdb.skipped ? ` · ${COV.thesportsdb.skipped} skipped` : ""}</b></div>` : ""}
    ${COV.catchup_last ? `<div class="kv"><span>Weekly catch-up for late results</span><b>${esc(new Date(COV.catchup_last + "T12:00:00Z").toLocaleDateString("en-IE", {timeZone: "UTC", day: "numeric", month: "short"}))}</b></div>` : ""}
    ${COV.archive_months ? `<div class="kv"><span>Results archive</span><b>${COV.archive_months} month${COV.archive_months === 1 ? "" : "s"}</b></div>` : ""}
    <div class="kv"><span>Dropped: postponed / already started</span><b>${COV.dropped_postponed ?? 0} / ${COV.dropped_started ?? 0}</b></div>
    ${COV.last_error ? `<div class="kv"><span>Last error</span><b style="color:var(--red)">${esc(COV.last_error)}</b></div>` : ""}</div>`;
  const md = COV.model || {};
  if ((md.changes || []).length) {
    h += `<div class="sh"><h2 style="font-size:12px">Model adjustments</h2><p>What the daily analysis changed. Recent form counts ${Math.round((md.form_weight || 0) * 100)}%; older games fade with a ${md.half_life} day half-life.</p></div>
      <div class="panel">${md.changes.map(c => `<div class="log">${esc(c.text)}<small>${esc(c.date)}</small></div>`).join("")}</div>`;
  }
  if ((COV.notes || []).length) {
    h += `<div class="sh"><h2 style="font-size:12px">Notes</h2><p>Games skipped because a team name couldn't be matched, and other problems from this run.</p></div>
      <div class="panel">${COV.notes.map(n => `<div class="log">${esc(n)}</div>`).join("")}</div>`;
  }
  h += `<div class="sh"><h2 style="font-size:12px">Competitions</h2></div>
    <div class="subtabs"><button data-cv="all" class="${covProblems ? "" : "on"}">All ${comps.length}</button><button data-cv="prob" class="${covProblems ? "on" : ""}">Problems only</button></div><div class="panel">`;
  for (const c of comps) {
    if (covProblems && ["covered", "no_games", "not_available", "switched_off"].includes(c.status)) continue;
    const [cls, label] = STATUS[c.status] || ["grey", c.status];
    const detail = c.status === "covered" || c.status === "partial" ? `${c.games} game${c.games === 1 ? "" : "s"}` : "";
    h += `<div class="cov"><div class="vb">${c.value}</div><div><div class="t">${esc(c.name)}${c.newly_found ? ` <span class="chip green">New</span>` : ""}</div>
      <div class="m">${c.note ? esc(c.note) : (c.matched || []).map(m => esc(m.name)).join(", ")}</div></div>
      <div style="text-align:right"><span class="chip ${cls}">${label}</span>${detail ? `<div class="m">${detail}</div>` : ""}</div></div>`;
  }
  return h + `</div>`;
}
function howView(){
  return `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>
    <div class="sh"><h2>How it works</h2></div><div class="panel prose">
    <h3>The score</h3>Every pick gets a score from 1 to 100 for how unlikely it is to go wrong, on its own section's scale. It isn't a percentage. A game becomes a pick at its section's minimum score: ${D.pass ? `${D.pass.goals[0]} for Easy Goals, Misses and Raining Goals, ${D.pass.ballon[0]} for Ballon d'Or` : D.min_club} (internationals a little lower while their results build up). Every game over the mark is a pick, however many that is, and lists are never padded. Next best shows the games just under it.
    <h3>Easy Goals</h3>Goes wrong on a 0-0. A game 97% or more likely to have a goal scores 100; ties at 100 are ranked by the actual chance.
    <h3>Misses and Ballon d'Or</h3>A game goes on only one of the two. Ballon d'Or takes clear favourites (${Math.round(D.ballon_min * 100)}% or more to win) that reach its pass mark. Every other game can go in Misses, including strong favourites that just missed Ballon d'Or, where a 3/1 underdog scores about 50 and a 25/1 underdog 100.
    <h3>Raining Goals</h3>Goes wrong if either team fails to score.
    <h3>Team strength</h3>Attack and defence ratings come from every result, adjusted for the opponent and the league, and update every morning. Recent form counts a little extra. National teams use three years of internationals.
    <h3>Learning from results</h3>Every prediction is stored and checked against what happened. Each morning, settings are nudged where the evidence shows the forecasts are off, separately for clubs and internationals. Changes are listed on the Coverage screen.
    <h3>Updates</h3>The list is made at 6:15 each morning. It scores today's games and tomorrow's, and picks the best games for each day; the app shows today's, with games that have kicked off moved to the bottom, and switches to tomorrow's at 23:50 (they're refreshed again at 6:15). At about 6 pm a short update marks postponed games and adds the results so far; it never changes picks or scores.
    <h3>Results only</h3>Some competitions on OpenFootAPI only get results after the games are played, never the games beforehand. For most of them (Scotland, Portugal, Brazil, MLS and others) Goalscraper takes the upcoming games from TheSportsDB instead, matching both teams strictly; a game it can't match is skipped and listed under Notes on Coverage. Their picks settle when OpenFootAPI adds the results, which can take a few days. Any others can't be scored. Coverage labels them "Results only" (after two weeks of watching), and the label goes as soon as OpenFootAPI lists their games in advance. Their results still feed the team ratings. Every Monday, Goalscraper also looks back 14 days for results that were added late.
    <h3>International pass mark</h3>Internationals start with a lower pass mark because national teams play few games, which keeps their scores lower. It rises 1 point for every 50 international games Goalscraper has predicted and settled, up to the club mark, and pauses while the model check flags internationals.
    <h3>Record</h3>Each section's tab shows its hit rate over the last 30 days and all time, how each score band and competition has done, and every settled pick by day. All results holds every result stored, with Goalscraper's scores for the games it rated, and the model check: forecast against actual for each competition, flagged when the gap is too big to be bad luck.
    <h3>By competition</h3>In the menu: for each competition, the best 5 Easy Goals and best 3 Raining Goals games of the day, ranked within that competition, whether or not they made the main lists. Games that are also section picks say PICK.
    <h3>All games</h3>Each game shows its score in every section: EG = Easy Goals, BD = Ballon d'Or, MI = Misses, RG = Raining Goals.
    <h3>Reality check</h3>Scores are a ranking, not a guarantee. At short prices one losing pick can wipe out many winners. The Record screen shows how each section is really doing.</div>`;
}
function banners(){
  const b = [];
  if (D) {
    if (Date.now() - Date.parse(D.generated_utc) > 26 * 3600 * 1000)
      b.push(`<div class="banner stale"><b>OUT OF DATE</b> &nbsp;This list was made ${esc(new Date(D.generated_utc).toLocaleString("en-IE", {timeZone: TZ, dateStyle: "medium", timeStyle: "short"}))}. This morning's update may have failed.</div>`);
    if ((D.new_competitions || []).length)
      b.push(`<div class="banner new"><b>NEW ON OPENFOOTAPI</b> &nbsp;${D.new_competitions.map(esc).join(", ")} now included automatically.</div>`);
  }
  if (COV && COV.last_error) b.push(`<div class="banner stale"><b>UPDATE PROBLEM</b> &nbsp;${esc(COV.last_error)}</div>`);
  $("#banners").innerHTML = b.join("");
}

/* ---------- wiring ---------- */
let tab = "selected", page = null;
function render(){
  const m = $("#main");
  if (!D) { m.innerHTML = `<div class="empty"><b>NO DATA YET</b>The first morning run hasn't finished. Run it from GitHub's Actions tab.</div>`; return; }
  if (page === "all") { m.innerHTML = allView(); allRows(); }
  else if (page === "comps") m.innerHTML = compsView();
  else if (page === "record") { m.innerHTML = recordView(); if (recTab === "all") resRows(); }
  else if (page === "coverage") m.innerHTML = coverageView();
  else if (page === "how") m.innerHTML = howView();
  else m.innerHTML = tab === "selected" ? selectedView() : sectionView(tab);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", !page && b.dataset.tab === tab));
  tick();
}
function tick(){
  const el = $("#cd"); if (!el) return;
  const up = selectedGames().filter(x => x.g.ts > now() && !x.g.tags.includes("postponed") && !x.g.result);
  if (!up.length) return;
  let s = Math.max(0, Math.round(up[0].g.ts - now()));
  const days = Math.floor(s / 86400); s -= days * 86400;
  const hh = String(Math.floor(s / 3600)).padStart(2, "0"), mm = String(Math.floor(s % 3600 / 60)).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
  el.textContent = `${days ? days + "d " : ""}${hh}:${mm}:${ss}`;
}
setInterval(tick, 1000);
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; page = null; window.scrollTo(0, 0); render(); });
const menu = on => { $("#sheet").classList.toggle("on", on); $("#scrim").classList.toggle("on", on); };
$("#menuBtn").onclick = () => menu(!$("#sheet").classList.contains("on"));
$("#scrim").onclick = () => menu(false);
$("#sheet").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; page = b.dataset.go; menu(false); window.scrollTo(0, 0); render(); });
document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) { page = null; render(); return; }
  if (e.target.closest("#fold")) { foldOpen = !foldOpen; render(); return; }
  const rt = e.target.closest("[data-rt]"); if (rt) { recTab = rt.dataset.rt; recDays = 7; render(); return; }
  if (e.target.closest("[data-older]")) { recDays += 7; keepScroll(); return; }
  const kk = e.target.closest("[data-kick]"); if (kk) { kickOpen[kk.dataset.kick] = !kickOpen[kk.dataset.kick]; keepScroll(); return; }
  if (e.target.closest("[data-comp]")) { compOpen = !compOpen; keepScroll(); return; }
  if (e.target.closest("[data-chk]")) { chkOpen = !chkOpen; keepScroll(); return; }
  const rm = e.target.closest("[data-rm]"); if (rm) { resMine = rm.dataset.rm === "1"; resComp = ""; keepScroll(); return; }
  const cv = e.target.closest("[data-cv]"); if (cv) { covProblems = cv.dataset.cv === "prob"; render(); return; }
  const nb = e.target.closest("[data-next]"); if (nb) { nextOpen[nb.dataset.next] = !nextOpen[nb.dataset.next]; render(); return; }
  const r = e.target.closest("[data-open]");
  if (r) { const d = document.querySelector(`[data-det="${CSS.escape(r.dataset.open)}"]`);
    if (d) { d.classList.toggle("open"); d.classList.contains("open") ? OPEN.add(r.dataset.open) : OPEN.delete(r.dataset.open); } }
});
document.addEventListener("input", e => { if (e.target.id === "q") allRows(); if (e.target.id === "rq") { resQ = e.target.value; resRows(); } });
document.addEventListener("change", e => { if (e.target.id === "fc" || e.target.id === "so") allRows();
  if (e.target.id === "dy") { allDay = e.target.value; allRows(); }
  if (e.target.id === "cday") { compDay = e.target.value; keepScroll(); }
  if (e.target.id === "ccomp") { compSel = e.target.value; keepScroll(); }
  if (e.target.id === "rc") { resComp = e.target.value; keepScroll(); }
  if (e.target.id === "rd") { resDate = e.target.value; resRows(); } });
function keepScroll(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
setInterval(() => { if (!page || page === "all") { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 60000);
(async function start(){
  [D, COV, REC, RIDX] = await Promise.all([getJSON("today.json"), getJSON("coverage.json"), getJSON("record.json"), getJSON("results/index.json")]);
  if (REC) for (const d of REC.days) d.picks = d.picks.map(p => ({ts: p.t, h: p.h, a: p.a, comp: p.c, section: p.k, team: p.tm,
    score: p.s, rank: p.rk, result: p.r, res: p.res, v1: p.v1}));
  banners();
  render();
})();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
