<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Goalscraper</title>
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goalscraper">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12; --plate1:#262a30; --plate2:#1b1e23; --plate3:#15181c; --edge:#363c44; --edge-hi:#4a515a;
  --text:#ece8df; --mute:#9aa0a8; --faint:#6c727a;
  --gold:#c9a54a; --gold-hi:#ecd38a; --gold-lo:#7d5f22;
  --red:#e5484d; --amber:#e0a63a; --green:#4cc38a;
  --engraved:"Cinzel","Trajan Pro",Georgia,serif;
  --gothic:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --plain:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabbar:64px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;min-height:100vh;color:var(--text);font:15px/1.45 var(--plain);
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%,rgba(201,165,74,.10),transparent 55%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#14171b,#0d0f12 40%);
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 16px);
}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
/* header */
header{padding:calc(14px + env(safe-area-inset-top)) 0 10px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}
.brand img{width:46px;height:46px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.brand h1{margin:0;font:400 40px/1 var(--gothic);letter-spacing:.5px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.8))}
.sub{font:700 11px/1.4 var(--engraved);letter-spacing:3px;color:var(--mute);margin-top:6px;text-transform:uppercase}
.rule{height:1px;margin:12px auto 0;max-width:420px;background:linear-gradient(90deg,transparent,var(--gold-lo),var(--gold),var(--gold-lo),transparent)}
.banner{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:13.5px;text-align:left;border:1px solid}
.banner.rehearsal{border-color:rgba(201,165,74,.5);background:rgba(201,165,74,.08);color:#e9d9a8}
.banner.stale{border-color:rgba(229,72,77,.55);background:rgba(229,72,77,.10);color:#f3b9bb}
.banner b{font-family:var(--engraved);letter-spacing:1.5px;font-size:12px}
/* panels */
.plate{
  background:linear-gradient(180deg,var(--plate1),var(--plate2) 60%,var(--plate3));
  border:1px solid var(--edge);border-top-color:var(--edge-hi);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);
}
h2.section{font:700 13px/1 var(--engraved);letter-spacing:4px;color:var(--gold);text-transform:uppercase;
  margin:18px 2px 10px;display:flex;align-items:center;gap:10px}
h2.section::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-lo),transparent)}
.hint{color:var(--mute);font-size:13px;margin:0 2px 12px}
/* controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.controls input{grid-column:1 / -1}
@media(min-width:640px){.controls{grid-template-columns:2fr 1.4fr 1fr}.controls input{grid-column:auto}}
.controls input,.controls select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--edge);
  background:#121418;color:var(--text);font:inherit;font-size:14px}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--gold)}
/* game cards */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr}}
.card{padding:14px 14px 12px;position:relative}
.card.top::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(201,165,74,.35)}
.row1{display:flex;align-items:flex-start;gap:10px}
.rank{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:9px;display:grid;place-items:center;
  font:800 14px/1 var(--engraved);color:#1b1610;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.6)}
.rank.plain{background:#2b3037;color:var(--mute);box-shadow:none;font-size:12px}
.when{flex:1;min-width:0}
.ko{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 22px/1.1 var(--plain);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.ko .x{color:var(--red);font:900 26px/1 var(--plain);text-shadow:0 0 10px rgba(229,72,77,.45)}
.ko .ago{flex-basis:100%;font:600 12px/1.2 var(--plain);color:#f0a2a4;letter-spacing:0;margin-top:-2px}
.comp{font:700 12px/1.3 var(--engraved);letter-spacing:1.6px;color:var(--gold);text-transform:uppercase;margin-top:5px}
.comp span{color:var(--faint);font-family:var(--plain);letter-spacing:0;text-transform:none;font-weight:500}
.scorebox{flex:none;text-align:right}
.score{font:800 38px/1 var(--plain);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.score-label{font:700 9.5px/1 var(--engraved);letter-spacing:2px;color:var(--mute);margin-top:3px}
.teams{margin-top:12px;display:grid;gap:6px}
.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.04)}
.tname{font:700 18px/1.2 var(--plain);overflow-wrap:anywhere}
.tname small{display:block;font:500 11.5px/1.2 var(--plain);color:var(--faint);margin-top:2px}
.rates{display:flex;gap:10px;font-variant-numeric:tabular-nums}
.rate{text-align:center;min-width:34px}
.rate b{display:block;font:800 19px/1 var(--plain)}
.rate i{display:block;font:700 9px/1 var(--engraved);font-style:normal;letter-spacing:1.4px;color:var(--mute);margin-top:4px}
.stats{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;font-size:13.5px}
@media(min-width:420px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat .k{font:700 9.5px/1.2 var(--engraved);letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
.stat .v{font:600 15px/1.3 var(--plain);font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--faint)}
.foot{margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:600 11.5px/1.5 var(--plain);border:1px solid}
.chip.amber{color:#f2c56b;border-color:rgba(224,166,58,.45);background:rgba(224,166,58,.12)}
.chip.grey{color:var(--mute);border-color:var(--edge);background:rgba(255,255,255,.03)}
.chip.green{color:#7fdcaf;border-color:rgba(76,195,138,.4);background:rgba(76,195,138,.1)}
.chip.red{color:#f3a0a3;border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.12)}
.track{margin-left:auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  font:700 11px/1 var(--engraved);letter-spacing:1.5px;color:var(--mute);padding:6px 4px}
.track input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:6px;border:1.5px solid var(--gold-lo);
  background:#121418;display:grid;place-items:center;cursor:pointer}
.track input:checked{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold)}
.track input:checked::after{content:"✓";color:#1b1610;font:900 14px/1 var(--plain)}
.track input:checked + span{color:var(--gold)}
.result{font:700 13px/1 var(--plain);padding:4px 9px;border-radius:7px}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;font:700 14px/1.4 var(--engraved);letter-spacing:2px;color:var(--gold);margin-bottom:6px}
/* table (wide screens) */
.tablewrap{overflow-x:auto;padding:4px}
table.games{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.games th{font:700 10.5px/1.2 var(--engraved);letter-spacing:1.5px;color:var(--gold);text-align:left;padding:10px 8px;
  border-bottom:1px solid var(--gold-lo);white-space:nowrap;position:sticky;top:0;background:var(--plate2)}
table.games td{padding:9px 7px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
table.games tr:last-child td{border-bottom:0}
table.games tr.top td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.t-ko{font:700 17px/1 var(--plain);white-space:nowrap}
.t-ko .x{color:var(--red);font-weight:900;font-size:19px;margin-left:5px}
.t-ko small{display:block;font:500 11px/1.2 var(--plain);color:#f0a2a4;margin-top:3px}
.t-comp{font:700 11px/1.3 var(--engraved);letter-spacing:1px;color:var(--gold);text-transform:uppercase;max-width:150px}
.t-team{font:700 15px/1.25 var(--plain);min-width:120px}
table.games .chip{white-space:nowrap;font-size:11px;padding:2px 7px;margin:1px 0}
.t-tags{min-width:84px}
.t-r{font:800 15px/1 var(--plain);text-align:center;min-width:30px}
.t-score{font:800 24px/1 var(--plain);text-align:right}
.num{text-align:right;white-space:nowrap}
/* record + coverage */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
@media(min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.big .k{font:700 10px/1.2 var(--engraved);letter-spacing:1.8px;color:var(--mute);text-transform:uppercase}
.big .v{font:800 26px/1.15 var(--plain);font-variant-numeric:tabular-nums}
.big .s{font-size:12px;color:var(--faint)}
.list{padding:4px 0}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid rgba(255,255,255,.05)}
.li:first-child{border-top:0}
.li .main{min-width:0}
.li .t{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.li .m{font-size:12px;color:var(--faint)}
.dayhead{padding:10px 14px 6px;font:700 11.5px/1 var(--engraved);letter-spacing:2px;color:var(--gold);border-top:1px solid var(--edge);text-transform:uppercase}
.dayhead:first-child{border-top:0}
.subtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.subtabs button{flex:1;min-width:120px;padding:10px;border-radius:10px;border:1px solid var(--edge);background:#15181c;color:var(--mute);
  font:700 11.5px/1 var(--engraved);letter-spacing:1.5px;cursor:pointer}
.subtabs button.on{color:#1b1610;background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold)}
.covsum{padding:14px;display:grid;gap:6px;font-size:14px}
.covsum div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(255,255,255,.06);padding-bottom:6px}
.covsum div:last-child{border-bottom:0}
.covsum span:first-child{color:var(--mute)}
.covsum b{font-variant-numeric:tabular-nums}
.vbadge{font:800 13px/1 var(--plain);min-width:38px;text-align:center;padding:6px 0;border-radius:8px;background:#2a2f36;color:var(--gold-hi);font-variant-numeric:tabular-nums}
details.about{margin-top:16px;padding:12px 14px}
details.about summary{cursor:pointer;font:700 12px/1.3 var(--engraved);letter-spacing:2px;color:var(--gold);text-transform:uppercase}
details.about p,details.about li{color:#cfcac0;font-size:13.5px}
details.about ul{padding-left:18px;margin:6px 0}

/* compact top-10 card */
.cc{padding:10px 12px 9px}
.cc .r1{display:flex;align-items:center;gap:9px}
.cc .rank{min-width:28px;height:28px;font-size:12.5px;border-radius:8px}
.cc .when{flex:1;min-width:0;display:flex;flex-direction:column}
.cc .t1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cc .tm{font:700 17px/1.1 var(--plain);font-variant-numeric:tabular-nums}
.cc .x{color:var(--red);font:900 18px/1 var(--plain);text-shadow:0 0 8px rgba(229,72,77,.45)}
.cc .ag{font:600 11px/1.2 var(--plain);color:#f0a2a4}
.cc .cp{font:700 10.5px/1.3 var(--engraved);letter-spacing:1.3px;color:var(--gold);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .sc{font:800 27px/1 var(--plain);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.cc .tl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-top:7px}
.cc .tn{font:700 15.5px/1.2 var(--plain);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .rt{display:flex;gap:9px;font-variant-numeric:tabular-nums}
.cc .rt span{min-width:30px;text-align:center;font:800 15px/1 var(--plain)}
.cc .rt i{display:block;font:700 8px/1 var(--engraved);font-style:normal;letter-spacing:1.2px;color:var(--mute);margin-top:3px}
.cc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.06);font-size:12.5px;color:#cfcac0}
.cc .ft b{font-variant-numeric:tabular-nums}
.cc .track{padding:2px 0 2px 4px}
.cc .track input{width:20px;height:20px}
.cards.compact{gap:8px}
/* slim all-games rows */
.rows{padding:2px 0}
.gr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid rgba(255,255,255,.05);cursor:pointer}
.gr:first-child{border-top:0}
.gr .vbadge{min-width:52px;font-size:14px;padding:7px 0}
.gr .t{font:700 14.5px/1.25 var(--plain);overflow-wrap:anywhere}
.gr .m{font-size:12px;color:var(--faint);margin-top:2px}
.gr .m .tm{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.gr .m .x{color:var(--red);font-weight:900;margin-left:2px}
.gr .m .cpn{font:700 10px/1 var(--engraved);letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.gr .track{padding:4px 0}
.grx{padding:2px 12px 12px 74px;font-size:12.5px;color:#cfcac0;border-top:0}
.grx .tl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:5px}
.grx .rt{display:flex;gap:8px;font-variant-numeric:tabular-nums}
.grx .rt span{min-width:28px;text-align:center;font:800 13.5px/1 var(--plain)}
.grx .rt i{display:block;font:700 7.5px/1 var(--engraved);font-style:normal;letter-spacing:1px;color:var(--mute);margin-top:3px}
.grx .ln{margin-top:7px}
.banner.new{border-color:rgba(76,195,138,.5);background:rgba(76,195,138,.08);color:#bfead3}
/* bottom tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(180deg,#23272d,#15181c);border-top:1px solid var(--gold-lo);
  box-shadow:0 -8px 22px rgba(0,0,0,.55)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar)}
nav.tabs button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:700 10px/1 var(--engraved);letter-spacing:1.2px;cursor:pointer;position:relative;text-transform:uppercase}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--gold-hi)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="wrap">
  <div class="brand"><img src="logo.svg" alt=""><h1>Goalscraper</h1></div>
  <div class="sub" id="sub">Loading…</div>
  <div class="rule"></div>
  <div id="banners"></div>
</header>

<main class="wrap">
  <section id="tab-top"></section>
  <section id="tab-all" class="hidden">
    <h2 class="section">All games</h2>
    <p class="hint">Tap a game for team ratings and details.</p>
    <div class="controls">
      <input id="q" type="search" placeholder="Search team or competition" autocomplete="off">
      <select id="fcomp"><option value="">All competitions</option></select>
      <select id="sort">
        <option value="score">Sort: score</option>
        <option value="ko">Sort: kickoff</option>
        <option value="odds">Sort: odds</option>
      </select>
    </div>
    <div id="allList"></div>
  </section>
  <section id="tab-record" class="hidden"></section>
  <section id="tab-coverage" class="hidden"></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="top" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Top 10</button>
  <button data-tab="all"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>All games</button>
  <button data-tab="record"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>Record</button>
  <button data-tab="coverage"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Coverage</button>
</div></nav>

<script>
(function(){
"use strict";
const TZ = "Europe/Dublin";
let D = null, COV = null, HIST = null;

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d=1) => x == null ? "–" : (x*100).toFixed(d) + "%";
const store = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function hue(v){ // 0..100 -> red .. amber .. green
  const t = Math.max(0, Math.min(1, (v - 1) / 99));
  return `hsl(${Math.round(t * 128)} ${68 + t*4}% ${52 + Math.sin(t*Math.PI)*6}%)`;
}
const fmtTime = ts => new Intl.DateTimeFormat("en-IE",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(ts*1000));
const fmtDay = (ts, opts) => new Intl.DateTimeFormat("en-IE",Object.assign({timeZone:TZ,weekday:"short",day:"numeric",month:"short"},opts||{})).format(new Date(ts*1000));
function nowTs(){
  // In rehearsal the clock runs from the rehearsal morning, so "kicked off" marks still make sense.
  const real = Date.now()/1000;
  if (D && D.mode === "rehearsal"){
    const gen = Date.parse(D.generated_utc)/1000;
    return D.window_start_ts + Math.max(0, real - gen);
  }
  return real;
}
function ago(sec){
  const m = Math.floor(sec/60);
  if (m < 60) return `kicked off ${m} min ago`;
  const h = Math.floor(m/60), r = m % 60;
  return `kicked off ${h} h ${r} min ago`;
}
const tracked = () => store.get("gs_tracked", {});

/* ---------- loading ---------- */
async function getJSON(name){
  try{ const r = await fetch(`data/${name}?v=${Date.now()}`, {cache:"no-store"}); if (r.ok) return await r.json(); }catch(e){}
  return (window.__GS__ || {})[name.replace(".json","")] || null;
}

/* ---------- header ---------- */
function header(){
  const sub = $("#sub");
  if (!D){ sub.textContent = "No data yet"; return; }
  const start = D.window_start_ts;
  sub.textContent = `${fmtDay(start,{weekday:"long",month:"long"})} · ${D.games.length} games · next ${Math.round((D.window_end_ts-start)/3600)} hours`;
  const b = [];
  if (D.mode === "rehearsal"){
    b.push(`<div class="banner rehearsal"><b>REHEARSAL</b> &nbsp;Real games from ${esc(fmtDay(start,{weekday:"long",month:"long",year:"numeric"}))}, run as if it were that morning. No odds in rehearsal. Switch to live when you have the Pro plan.</div>`);
  } else {
    const age = Date.now() - Date.parse(D.generated_utc);
    if (age > 26*3600*1000){
      b.push(`<div class="banner stale"><b>OUT OF DATE</b> &nbsp;This list was made ${esc(new Date(D.generated_utc).toLocaleString("en-IE",{timeZone:TZ,dateStyle:"medium",timeStyle:"short"}))}. This morning's update may have failed — check the Coverage tab.</div>`);
    }
  }
  if (D.new_competitions && D.new_competitions.length){
    b.push(`<div class="banner new"><b>NEW ON OPENFOOTAPI</b> &nbsp;${D.new_competitions.map(esc).join(", ")} ${D.new_competitions.length === 1 ? "is" : "are"} now available and included automatically. See the Coverage tab.</div>`);
  }
  if (COV && COV.last_error){
    b.push(`<div class="banner stale"><b>UPDATE PROBLEM</b> &nbsp;${esc(COV.last_error)}</div>`);
  }
  $("#banners").innerHTML = b.join("");
}

/* ---------- game rendering ---------- */
function chips(g, short){
  const out = [];
  for (const t of g.tags || []){
    if (t === "below_min_odds") out.push(`<span class="chip amber">${short ? "Low odds" : `Below min odds (${D.min_odds.toFixed(2)})`}</span>`);
    else if (t === "no_odds") { if (D.odds_enabled !== false) out.push(`<span class="chip amber">No odds</span>`); }
    else if (t === "time_tbc") out.push(`<span class="chip grey">Time TBC</span>`);
    else if (t === "limited_data") out.push(`<span class="chip amber">${short ? "Limited" : "Limited data"}</span>`);
  }
  if (g.final){
    if (g.final.h == null) out.push(`<span class="chip grey">${esc(g.final.status)}</span>`);
    else {
      const nil = g.final.h === 0 && g.final.a === 0;
      out.push(`<span class="chip ${nil ? "red" : "green"}">${short ? "" : "Result "}${g.final.h}–${g.final.a}${nil ? " ✕" : " ✓"}</span>`);
    }
  }
  return out.join("");
}
function koHTML(g, table){
  const now = nowTs(), started = now >= g.ts;
  const t = esc(fmtTime(g.ts));
  if (table) return `<div class="t-ko">${t}${started ? `<span class="x" title="Kicked off">✕</span><small>${ago(now-g.ts)}</small>` : ""}</div>`;
  return `<div class="ko">${t}${started ? `<span class="x" aria-label="Kicked off">✕</span><span class="ago">${ago(now-g.ts)}</span>` : ""}</div>`;
}
function rate(v, label){ return `<div class="rate"><b style="color:${hue(v)}">${Math.round(v)}</b><i>${label}</i></div>`; }
function teamRow(t){
  return `<div class="team"><div class="tname">${esc(t.name)}<small>${t.games} game${t.games===1?"":"s"} of data</small></div>
    <div class="rates">${rate(t.ovr,"OVR")}${rate(t.att,"ATT")}${rate(t.def,"DEF")}</div></div>`;
}
function trackBox(g){
  const on = !!tracked()[g.fid];
  return `<label class="track"><input type="checkbox" data-fid="${g.fid}" ${on?"checked":""}><span>TRACK</span></label>`;
}
function koParts(g){
  const now = nowTs(), started = now >= g.ts;
  return {t: esc(fmtTime(g.ts)), started, ago: started ? ago(now - g.ts) : ""};
}
function rates(t){
  return `<div class="rt"><span style="color:${hue(t.ovr)}">${Math.round(t.ovr)}<i>OVR</i></span><span style="color:${hue(t.att)}">${Math.round(t.att)}<i>ATT</i></span><span style="color:${hue(t.def)}">${Math.round(t.def)}<i>DEF</i></span></div>`;
}
function footLine(g){
  const odds = D.odds_enabled === false ? "" :
    ` · O0.5 <b>${g.odds ? g.odds.toFixed(2) : "–"}</b>${g.edge == null ? "" : ` · edge <b>${(g.edge>=0?"+":"") + g.edge.toFixed(1)}</b>`}`;
  return `P(0-0) <b>${pct(g.p00)}</b> · xG <b>${g.xg_home.toFixed(1)}–${g.xg_away.toFixed(1)}</b>${odds}`;
}
function card(g){
  const k = koParts(g);
  return `<article class="card plate cc ${g.top10?"top":""}">
    <div class="r1"><div class="rank">${g.rank}</div>
      <div class="when"><div class="t1"><span class="tm">${k.t}</span>${k.started ? `<span class="x" aria-label="Kicked off">✕</span><span class="ag">${k.ago}</span>` : ""}</div>
        <div class="cp">${esc(g.comp)}</div></div>
      <div class="sc" style="color:${hue(g.score)}">${g.score.toFixed(2)}</div></div>
    <div class="tl"><div class="tn">${esc(g.home.name)}</div>${rates(g.home)}</div>
    <div class="tl"><div class="tn">${esc(g.away.name)}</div>${rates(g.away)}</div>
    <div class="ft"><span>${footLine(g)}</span>${chips(g)}${trackBox(g)}</div>
  </article>`;
}
function slimRow(g){
  const k = koParts(g);
  return `<div class="gr" data-row="${esc(g.fid)}"><div class="vbadge" style="color:${hue(g.score)}">${g.score.toFixed(2)}</div>
    <div class="main"><div class="t">${esc(g.home.name)} v ${esc(g.away.name)}</div>
      <div class="m"><span class="tm">${k.t}</span>${k.started ? `<span class="x">✕</span>` : ""} · <span class="cpn">${esc(g.comp)}</span> · #${g.rank}${(g.tags||[]).includes("limited_data") ? " · limited data" : ""}</div></div>
    ${trackBox(g).replace("<span>TRACK</span>", "")}</div>
    <div class="grx hidden" data-detail="${esc(g.fid)}">
      ${k.started ? `<div style="color:#f0a2a4">${k.ago}</div>` : ""}
      <div class="tl"><div>${esc(g.home.name)}</div>${rates(g.home)}</div>
      <div class="tl"><div>${esc(g.away.name)}</div>${rates(g.away)}</div>
      <div class="ln">${footLine(g)}${g.round ? ` · ${esc(g.round)}` : ""}</div>
      <div class="ln">${chips(g)}</div>
    </div>`;
}
function tableHTML(list){
  const rows = list.map(g => `<tr class="${g.top10?"top":""}">
    <td class="num" style="color:var(--mute)">${g.rank}</td>
    <td>${koHTML(g, true)}</td>
    <td class="t-comp">${esc(g.comp)}</td>
    <td class="t-team">${esc(g.home.name)}</td>
    <td class="t-r" style="color:${hue(g.home.ovr)}">${Math.round(g.home.ovr)}</td><td class="t-r" style="color:${hue(g.home.att)}">${Math.round(g.home.att)}</td><td class="t-r" style="color:${hue(g.home.def)}">${Math.round(g.home.def)}</td>
    <td class="t-team">${esc(g.away.name)}</td>
    <td class="t-r" style="color:${hue(g.away.ovr)}">${Math.round(g.away.ovr)}</td><td class="t-r" style="color:${hue(g.away.att)}">${Math.round(g.away.att)}</td><td class="t-r" style="color:${hue(g.away.def)}">${Math.round(g.away.def)}</td>
    <td class="t-score" style="color:${hue(g.score)}">${g.score.toFixed(2)}</td>
    <td class="num">${pct(g.p00)}</td>
    <td class="num">${g.xg_home.toFixed(1)}–${g.xg_away.toFixed(1)}</td>
    ${D.odds_enabled === false ? "" : `<td class="num">${g.odds ? g.odds.toFixed(2) : "–"}</td>
    <td class="num">${g.edge == null ? "–" : (g.edge>=0?"+":"") + g.edge.toFixed(1)}</td>`}
    <td class="t-tags">${chips(g, true).replace(/<\/span><span/g, "</span><br><span")}</td>
    <td>${trackBox(g).replace("<span>TRACK</span>", "")}</td></tr>`).join("");
  return `<div class="plate tablewrap"><table class="games"><thead><tr>
    <th>#</th><th>Kickoff</th><th>Competition</th><th>Home</th><th>OVR</th><th>ATT</th><th>DEF</th>
    <th>Away</th><th>OVR</th><th>ATT</th><th>DEF</th><th class="num">Score</th><th class="num">P(0-0)</th>
    <th class="num">xG</th>${D.odds_enabled === false ? "" : `<th class="num">O0.5</th><th class="num">Edge</th>`}<th>Tags</th><th>Track</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
const wide = () => window.matchMedia("(min-width: 1000px)").matches;

/* ---------- tabs ---------- */
function renderTop(){
  const el = $("#tab-top");
  if (!D){ el.innerHTML = `<div class="plate empty"><b>No data yet</b>The first morning run hasn't happened. Run it from GitHub (see the setup guide).</div>`; return; }
  const top = D.games.filter(g => g.top10);
  let html = `<h2 class="section">Top ${D.top_n}</h2>`;
  if (!top.length) html += `<div class="plate empty"><b>No games</b>Nothing in your competitions in the next 24 hours.</div>`;
  else html += wide() ? tableHTML(top) : `<div class="cards compact">${top.map(g => card(g)).join("")}</div>`;
  html += about();
  el.innerHTML = html;
}
function about(){
  const w = D.weights || {};
  return `<details class="about plate"><summary>How the score works</summary>
    <p>Each game gets a score from 1.00 to 100.00. Higher means a 0-0 is less likely. 100 means P(0-0) of 1% or less; 1 means 30% or more.</p>
    <ul>
      <li><b>Team strength</b> comes from every result this season (and last season if there are few games), adjusted for how strong each opponent was, and for how strong each team's league is.</li>
      <li><b>Recent form</b> is a small tweak (${Math.round((w.form||0)*100)}%) on top of long-term strength.</li>
      ${D.odds_enabled === false ? `<li>Data comes from OpenFootAPI's free plan, which has no bookmaker odds, so scores come from results alone.</li>` : `<li><b>Bookmaker match odds</b> pull the expected goals ${Math.round((w.market||0)*100)}% of the way towards the market's view, when odds are listed.</li>`}
      <li>Teams with little data are tagged <i>Limited data</i> and their score is trimmed slightly.</li>
    </ul>
    <p><b>A reality check:</b> if you bet at odds of ${D.min_odds.toFixed(2)}, you need to win about ${(100/D.min_odds).toFixed(0)} bets in every 100 just to break even, and one 0-0 wipes out roughly ${Math.round(1/(D.min_odds-1))} wins. Scores are a ranking, not a guarantee — the Record tab shows how they actually do.</p>
  </details>`;
}
function renderAll(){
  const el = $("#allList");
  if (!D){ el.innerHTML = ""; return; }
  const q = $("#q").value.trim().toLowerCase(), comp = $("#fcomp").value, sort = $("#sort").value;
  let list = D.games.filter(g => (!comp || g.comp === comp) &&
    (!q || (g.home.name + " " + g.away.name + " " + g.comp + " " + (g.league_name||"")).toLowerCase().includes(q)));
  if (sort === "ko") list.sort((a,b) => a.ts - b.ts || b.score - a.score);
  else if (sort === "odds") list.sort((a,b) => (b.odds||0) - (a.odds||0) || b.score - a.score);
  else list.sort((a,b) => b.score - a.score);
  if (!list.length){ el.innerHTML = `<div class="plate empty"><b>No matches</b>Try a different search or competition.</div>`; return; }
  el.innerHTML = wide() ? tableHTML(list) : `<div class="plate rows">${list.map(slimRow).join("")}</div>`;
}
function settle(r){
  if (!r) return {cls:"grey", txt:"Pending", st:"pending"};
  if (r.void || r.h == null) return {cls:"grey", txt:"Void", st:"void"};
  if (r.h === 0 && r.a === 0) return {cls:"red", txt:"0–0 ✕", st:"lost"};
  return {cls:"green", txt:`${r.h}–${r.a} ✓`, st:"won"};
}
function summary(games){
  let won=0, lost=0, voids=0, pend=0, pl=0, plN=0;
  for (const g of games){
    const s = settle(g.result).st;
    if (s==="won"){ won++; if (g.odds){ pl += g.odds - 1; plN++; } }
    else if (s==="lost"){ lost++; if (g.odds){ pl -= 1; plN++; } }
    else if (s==="void") voids++; else pend++;
  }
  const n = won + lost;
  return {won, lost, voids, pend, n, rate: n ? won/n : null, pl, plN};
}
let recordView = "top";
function renderRecord(){
  const el = $("#tab-record");
  const hist = HIST && HIST.games ? Object.entries(HIST.games).map(([fid,g]) => Object.assign({fid}, g)) : [];
  const mine = tracked();
  const set = recordView === "top" ? hist.filter(g => g.top10) : hist.filter(g => mine[g.fid]);
  const s = summary(set);
  const rehearsal = HIST && HIST.mode === "rehearsal";
  let html = `<h2 class="section">${rehearsal ? "Rehearsal record" : "Record"}</h2>
    <div class="subtabs"><button data-rv="top" class="${recordView==="top"?"on":""}">Top 10 each day</button>
    <button data-rv="mine" class="${recordView==="mine"?"on":""}">My ticked games (${Object.keys(mine).length})</button></div>`;
  if (rehearsal) html += `<p class="hint">These are past dates run in rehearsal mode, so you can see how the scores would have done. They're cleared when you switch to live.</p>`;
  html += `<div class="plate statgrid">
    <div class="big"><div class="k">Avoided 0-0</div><div class="v" style="color:${s.rate==null?"var(--text)":hue(s.rate>=0.97?100:s.rate*60)}">${s.rate==null?"–":(s.rate*100).toFixed(1)+"%"}</div><div class="s">${s.won} of ${s.n} settled</div></div>
    <div class="big"><div class="k">Ended 0-0</div><div class="v">${s.lost}</div><div class="s">losing picks</div></div>
    <div class="big"><div class="k">Pending / void</div><div class="v">${s.pend} / ${s.voids}</div><div class="s">not counted</div></div>
    ${D && D.odds_enabled === false ? `<div class="big"><div class="k">Tracked</div><div class="v">${set.length}</div><div class="s">games in this list</div></div>` : `<div class="big"><div class="k">Profit at best odds</div><div class="v" style="color:${s.pl>=0?"var(--green)":"var(--red)"}">${s.plN ? (s.pl>=0?"+":"") + s.pl.toFixed(2) : "–"}</div><div class="s">${s.plN ? `units, 1 per bet, ${s.plN} bets` : "needs games with odds"}</div></div>`}
  </div>`;
  if (!set.length){
    html += `<div class="plate empty" style="margin-top:12px"><b>Nothing yet</b>${recordView==="top" ? "The top 10 are recorded automatically each morning and settled the next morning." : "Tick <i>Track</i> on any game to follow it here. Ticks are saved on this device only."}</div>`;
  } else {
    const days = {};
    for (const g of set){ const k = fmtDay(g.ts,{weekday:"long",month:"long",year:"numeric"}); (days[k] = days[k] || []).push(g); }
    const keys = Object.keys(days).sort((a,b) => Math.max(...days[b].map(g=>g.ts)) - Math.max(...days[a].map(g=>g.ts)));
    html += `<div class="plate list" style="margin-top:12px">`;
    for (const k of keys){
      html += `<div class="dayhead">${esc(k)}</div>`;
      for (const g of days[k].sort((a,b) => (a.rank||99) - (b.rank||99))){
        const r = settle(g.result);
        html += `<div class="li"><div class="vbadge" style="color:${hue(g.score)}">${g.score.toFixed(0)}</div>
          <div class="main"><div class="t">${esc(g.home)} v ${esc(g.away)}</div><div class="m">${esc(g.comp)} · ${esc(fmtTime(g.ts))}${g.odds ? ` · odds ${g.odds.toFixed(2)}` : ""}${g.rank ? ` · ranked #${g.rank}` : ""}</div></div>
          <span class="chip ${r.cls}">${r.txt}</span></div>`;
      }
    }
    html += `</div>`;
  }
  el.innerHTML = html;
}
const STATUS = {
  covered:["green","Covered"], partial:["amber","Partly covered"], no_games:["grey","No games"],
  omitted_budget:["amber","Omitted: request limit"], blocked_plan:["red","Blocked by plan"],
  error:["red","Error"], not_found:["red","Not found in API"], not_available:["grey","Not on free plan"]
};
let covProblemsOnly = false;
function renderCoverage(){
  const el = $("#tab-coverage");
  if (!COV){ el.innerHTML = `<h2 class="section">Coverage</h2><div class="plate empty"><b>No report yet</b></div>`; return; }
  const ran = COV.generated_utc ? new Date(COV.generated_utc).toLocaleString("en-IE",{timeZone:TZ,dateStyle:"medium",timeStyle:"short"}) : "–";
  const comps = COV.competitions || [];
  const counts = {};
  comps.forEach(c => counts[c.status] = (counts[c.status]||0) + 1);
  let html = `<h2 class="section">Coverage report</h2>
  <div class="plate covsum">
    <div><span>Last run</span><b>${esc(ran)}</b></div>
    <div><span>Mode / plan</span><b>${esc(COV.mode)} · ${esc(COV.plan)}</b></div>
    <div><span>Requests used this run</span><b>${COV.requests_used}${COV.monthly_remaining != null ? ` · ${COV.monthly_remaining} left this month` : ` of ${COV.requests_available}`}</b></div>
    ${COV.source ? `<div><span>Data source</span><b>${esc(COV.source)}</b></div>` : ""}
    <div><span>Games scored</span><b>${COV.games_scored ?? "–"}</b></div>
    <div><span>Competitions with games scored</span><b>${(counts.covered||0) + (counts.partial||0)}</b></div>
    <div><span>No games today / not on free plan</span><b>${counts.no_games||0} / ${counts.not_available||0}</b></div>
    <div><span>Problems</span><b>${(counts.omitted_budget||0)+(counts.blocked_plan||0)+(counts.error||0)+(counts.not_found||0)}</b></div>
    ${(COV.notes||[]).length ? `<div><span>Notes</span><b style="text-align:right;font-weight:500">${COV.notes.map(esc).join("<br>")}</b></div>` : ""}
    <div><span>Dropped: postponed / already started</span><b>${COV.dropped_postponed ?? 0} / ${COV.dropped_started ?? 0}</b></div>
    <div><span>Games in competitions not on your list</span><b>${COV.other_competitions ?? 0} (ignored)</b></div>
    ${COV.last_error ? `<div><span>Last error</span><b style="color:var(--red)">${esc(COV.last_error)}</b></div>` : ""}
  </div>
  <div class="subtabs" style="margin-top:12px"><button data-cv="all" class="${covProblemsOnly?"":"on"}">All ${comps.length}</button><button data-cv="prob" class="${covProblemsOnly?"on":""}">Problems only</button></div>
  <div class="plate list">`;
  for (const c of comps){
    if (covProblemsOnly && ["covered","no_games","not_available"].includes(c.status)) continue;
    const [cls, label] = STATUS[c.status] || ["grey", c.status];
    let detail = "";
    if (c.status === "covered" || c.status === "partial") detail = `${c.games} game${c.games===1?"":"s"}${D && D.odds_enabled !== false ? ` · ${c.with_odds} with odds` : ""}`;
    else if (c.status === "omitted_budget") detail = `${c.games} game${c.games===1?"":"s"} skipped`;
    const matched = (c.matched||[]).map(m => m.name).join(", ");
    const more = c.matched_count > (c.matched||[]).length ? ` +${c.matched_count - c.matched.length} more` : "";
    html += `<div class="li"><div class="vbadge" title="Your priority value">${c.value}</div>
      <div class="main"><div class="t">${esc(c.name)}${c.newly_found ? ` <span class="chip green" style="margin-left:4px">New</span>` : ""}</div>
      <div class="m">${matched ? esc(matched) + more : ""}${c.note ? (matched ? " · " : "") + esc(c.note) : ""}</div></div>
      <div style="text-align:right"><span class="chip ${cls}">${label}</span>${detail ? `<div class="m" style="margin-top:4px">${detail}</div>` : ""}</div></div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

/* ---------- wiring ---------- */
function show(tab){
  for (const t of ["top","all","record","coverage"]) $("#tab-"+t).classList.toggle("hidden", t !== tab);
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  store.set("gs_tab", tab);
  window.scrollTo(0, 0);
  render(tab);
}
function render(tab){
  tab = tab || store.get("gs_tab","top");
  if (tab === "top") renderTop(); else if (tab === "all") renderAll(); else if (tab === "record") renderRecord(); else renderCoverage();
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(b.dataset.tab); });
document.addEventListener("change", e => {
  const box = e.target.closest("input[data-fid]");
  if (!box) return;
  const t = tracked(), fid = box.dataset.fid;
  if (box.checked) t[fid] = Date.now(); else delete t[fid];
  store.set("gs_tracked", t);
  document.querySelectorAll(`input[data-fid="${fid}"]`).forEach(x => x.checked = box.checked);
});
document.addEventListener("click", e => {
  const row = e.target.closest(".gr");
  if (row && !e.target.closest("label.track")){
    const d = document.querySelector(`[data-detail="${CSS.escape(row.dataset.row)}"]`);
    if (d) d.classList.toggle("hidden");
  }
  const rv = e.target.closest("button[data-rv]"); if (rv){ recordView = rv.dataset.rv; renderRecord(); }
  const cv = e.target.closest("button[data-cv]"); if (cv){ covProblemsOnly = cv.dataset.cv === "prob"; renderCoverage(); }
});
["input","change"].forEach(ev => { $("#q").addEventListener(ev, renderAll); });
$("#fcomp").addEventListener("change", renderAll);
$("#sort").addEventListener("change", e => { store.set("gs_sort", e.target.value); renderAll(); });
let lastWide = null;
window.addEventListener("resize", () => { const w = wide(); if (w !== lastWide){ lastWide = w; render(); } });
setInterval(() => render(), 60 * 1000);   // keeps the kicked-off marks current
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

(async function start(){
  [D, COV, HIST] = await Promise.all([getJSON("today.json"), getJSON("coverage.json"), getJSON("history.json")]);
  header();
  if (D){
    const comps = [...new Set(D.games.map(g => g.comp))].sort();
    $("#fcomp").innerHTML = `<option value="">All competitions</option>` + comps.map(c => `<option>${esc(c)}</option>`).join("");
    if (D.odds_enabled === false) { const o = $("#sort").querySelector('option[value="odds"]'); if (o) o.remove(); }
    $("#sort").value = store.get("gs_sort", "score") === "odds" && D.odds_enabled === false ? "score" : store.get("gs_sort", "score");
  }
  lastWide = wide();
  show(store.get("gs_tab", "top"));
})();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>

<body>
<header><div class="wrap hd">
  <img src="logo.svg" alt="">
  <h1>Goalscraper</h1>
  <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div></header>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <button data-go="all"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>All games</button>
  <button data-go="record"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Record</button>
  <button data-go="coverage"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Coverage</button>
  <button data-go="how"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>How it works</button>
</div>

<div class="wrap" id="banners"></div>
<main class="wrap" id="main"><div class="empty"><b>LOADING</b></div></main>

<nav aria-label="Sections"><div class="in">
  <button data-tab="selected"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Selected</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 7V3.5M16 10l3.4-1.2M14.5 14.5l2 3M9.5 14.5l-2 3M8 10L4.6 8.8"/></svg>Easy Goals</button>
  <button data-tab="misses"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>Misses</button>
  <button data-tab="ballon"><svg viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 4M16 5h3a3 3 0 0 1-3 4M12 12v4M9 20h6M10 16h4"/></svg>Ballon d'Or</button>
  <button data-tab="btts"><svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 15z"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/></svg>Raining Goals</button>
</div></nav>

<script>
(function(){
"use strict";
let D = null, COV = null, REC = null;
const TZ = "Europe/Dublin";
async function getJSON(name){
  try { const r = await fetch(`data/${name}?v=${Date.now()}`, {cache: "no-store"}); if (r.ok) return await r.json(); } catch (e) {}
  return (window.__GS__ || {})[name.replace(".json", "")] || null;
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const hue = v => { const t = Math.max(0, Math.min(1, (v - 1) / 99)); return `hsl(${Math.round(t * 128)} 70% ${52 + Math.sin(t * Math.PI) * 6}%)`; };
const tm = ts => new Intl.DateTimeFormat("en-IE", {timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false}).format(new Date(ts * 1000));
const now = () => Date.now() / 1000;
const ago = s => { const m = Math.floor(s / 60); return m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };
const odds = p => { const f = 1 / p - 1; return f >= 1 ? `${Math.round(f)}/1` : `1/${Math.round(1 / f)}`; };

const SEC = {
  goals:  {name: "Easy Goals",   blurb: () => `Games most likely to have at least one goal, but no shorter than ${Math.round(D.goals_max * 100)}%.`,
           fig: g => [pct(1 - g.p00, 1), "1+ goals"]},
  misses: {name: "Misses",       blurb: () => `Teams most likely not to win (lose or draw). Underdogs no longer than ${D.misses_longest}/1.`,
           fig: g => [pct(g.sec.misses.p, 0), "not to win"]},
  ballon: {name: "Ballon d'Or",  blurb: () => `Clear favourites (${Math.round(D.ballon_min * 100)}% or more to win), most likely first.`,
           fig: g => [pct(g.sec.ballon.p, 0), "to win"]},
  btts:   {name: "Raining Goals",blurb: () => "Games most likely to see both teams score.",
           fig: g => [pct(g.p_btts, 0), "both score"]},
};
const picks = key => D.games.filter(g => g.sec[key].pick).sort((a, b) => a.sec[key].rank - b.sec[key].rank);
const teamOf = (g, key) => g[g.sec[key].team].name;

const OPEN = new Set();
/* ---------- pieces ---------- */
function chips(g, key){
  const o = [];
  if (g.tags.includes("limited_data")) o.push(`<span class="chip amber">Limited data</span>`);
  if (g.tags.includes("time_tbc")) o.push(`<span class="chip grey">Time TBC</span>`);
  if (g.tags.includes("too_short") && (!key || key === "all")) o.push(`<span class="chip grey">Goals too short</span>`);
  if (g.intl) o.push(`<span class="chip grey">International</span>`);
  return o.join("");
}
function teamsLine(g, key){
  const pk = key === "misses" || key === "ballon" ? g.sec[key].team : null;
  const n = side => `<span class="${pk === side ? "pk" : ""}">${esc(g[side].name)}</span>`;
  return `${n("home")}<span class="v">v</span>${n("away")}`;
}
function subLine(g, key){
  const st = now() >= g.ts;
  return `<span class="tm">${tm(g.ts)}</span>${st ? `<span class="x">✕</span><span>${ago(now() - g.ts)}</span>` : ""}<span>·</span><span class="cp">${esc(g.comp)}</span>${chips(g, key)}`;
}
function rates(t){
  const c = v => `style="color:${hue(v)}"`;
  return `<div class="rt"><span ${c(t.ovr)}>${t.ovr}<i>OVR</i></span><span ${c(t.att)}>${t.att}<i>ATT</i></span><span ${c(t.def)}>${t.def}<i>DEF</i></span></div>`;
}
function details(g, key){
  const extra = {
    goals: `Chance of 0-0 <b>${pct(g.p00, 1)}</b>`,
    misses: `${esc(teamOf(g, "misses"))} to lose or draw <b>${pct(g.sec.misses.p, 1)}</b> · model price for them to win about <b>${odds(1 - g.sec.misses.p)}</b>`,
    ballon: `${esc(teamOf(g, "ballon"))} to win <b>${pct(g.sec.ballon.p, 1)}</b> · model price about <b>${odds(g.sec.ballon.p)}</b>`,
    btts: `${esc(g.home.name)} score <b>${pct(g.p_home_score)}</b> · ${esc(g.away.name)} score <b>${pct(g.p_away_score)}</b>`,
  }[key] || "";
  return `<div class="det ${OPEN.has(key + "-" + g.fid) ? "open" : ""}" data-det="${key}-${g.fid}">
    <div class="wdl"><span style="width:${g.pw_home * 100}%"></span><span style="width:${g.pd * 100}%"></span><span style="width:${g.pw_away * 100}%"></span></div>
    <div class="wdlk"><span>${esc(g.home.name)} ${pct(g.pw_home)}</span><span>Draw ${pct(g.pd)}</span><span>${esc(g.away.name)} ${pct(g.pw_away)}</span></div>
    <div class="tr"><div class="n">${esc(g.home.name)}</div>${rates(g.home)}</div>
    <div class="tr"><div class="n">${esc(g.away.name)}</div>${rates(g.away)}</div>
    <div class="dl">${extra}<br>Expected goals <b>${g.xg_home.toFixed(2)} – ${g.xg_away.toFixed(2)}</b> · ${esc(g.round)}${g.tags.includes("limited_data") ? "<br>Limited data: few results for at least one team, so the score is trimmed slightly." : ""}</div>
  </div>`;
}
function pickRow(g, key){
  const s = g.sec[key], [v, l] = SEC[key].fig(g);
  return `<div class="row" data-open="${key}-${g.fid}">
    <div class="sc" style="color:${hue(s.score)}">${s.score.toFixed(1)}<small>#${s.rank}</small></div>
    <div class="mid"><div class="teams">${teamsLine(g, key)}</div><div class="sub">${subLine(g, key)}</div></div>
    <div class="kf"><b>${v}</b><i>${l}</i></div></div>${details(g, key)}`;
}

/* ---------- next best (below the picks) ---------- */
const nextOpen = {};
function nextBest(key){
  const rest = D.games.filter(g => g.sec[key].listed !== false && !g.sec[key].pick).sort((a, b) => a.sec[key].rank - b.sec[key].rank);
  if (!rest.length) return "";
  const passed = rest.filter(g => g.sec[key].score >= (g.intl ? D.min_intl : D.min_club));
  const below = rest.filter(g => g.sec[key].score < (g.intl ? D.min_intl : D.min_club));
  let h = `<button class="fold ${nextOpen[key] ? "open" : ""}" data-next="${key}"><span>NEXT BEST (${rest.length})</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;
  if (nextOpen[key]) {
    h += `<div class="panel dim" style="margin-top:8px">`;
    if (passed.length) h += `<div class="gh">Passed the mark, outside the top ${D.top_n}</div>` + passed.map(g => pickRow(g, key)).join("");
    if (below.length) h += `<div class="gh">Below the pass mark: not picks</div>` + below.map(g => pickRow(g, key)).join("");
    h += `</div>`;
  }
  return h;
}

/* ---------- views ---------- */
function sectionView(key){
  const list = picks(key), S = SEC[key];
  let h = `<div class="sh"><h2>${S.name}</h2><p>${S.blurb()}</p>
    <div class="meta">${list.length} pick${list.length === 1 ? "" : "s"} · minimum score ${D.min_club} (internationals ${D.min_intl}) · tap a game for details · next best below</div></div>`;
  if (!list.length) return h + `<div class="note"><b>NO PICKS TODAY</b> &nbsp;No games reached the minimum score.</div>` + nextBest(key);
  h += `<div class="panel">${list.map(g => pickRow(g, key)).join("")}</div>`;
  if (list.length < D.top_n) h += `<div class="note"><b>ONLY ${list.length} PICK${list.length === 1 ? "" : "S"}</b> &nbsp;Only ${list.length} game${list.length === 1 ? "" : "s"} reached the minimum score today, so the list isn't padded with weaker ones.</div>`;
  return h + nextBest(key);
}
function selectedGames(){
  const m = new Map();
  for (const key of ["goals", "misses", "ballon"]) for (const g of picks(key)) {
    if (!m.has(g.fid)) m.set(g.fid, {g, labels: []});
    const lab = key === "goals" ? `Easy Goals #${g.sec.goals.rank}` :
      `${SEC[key].name} #${g.sec[key].rank} · ${teamOf(g, key)}`;
    m.get(g.fid).labels.push(lab);
  }
  return [...m.values()].sort((a, b) => a.g.ts - b.g.ts);
}
function selRow({g, labels}){
  return `<div class="row srow" data-open="sel-${g.fid}">
    <div class="ko">${tm(g.ts)}${now() >= g.ts ? `<small class="x">✕ ${ago(now() - g.ts)}</small>` : ""}</div>
    <div class="mid"><div class="teams">${esc(g.home.name)}<span class="v">v</span>${esc(g.away.name)}</div>
      <div class="sub"><span class="cp">${esc(g.comp)}</span>${chips(g, "sel")}</div>
      <div class="labels">${labels.map(l => `<span class="chip gold">${esc(l)}</span>`).join("")}</div></div></div>${details(g, "sel")}`;
}
let foldOpen = false;
function selectedView(){
  const all = selectedGames(), up = all.filter(x => x.g.ts > now()), st = all.filter(x => x.g.ts <= now());
  let h = `<div class="sh"><h2>Selected games</h2><p>Every pick from Easy Goals, Misses and Ballon d'Or, in kickoff order.</p></div>`;
  if (up.length) {
    const n = up[0].g;
    h += `<div class="count"><div class="k">NEXT KICK-OFF</div><div class="t" id="cd">--:--:--</div>
      <div class="g">${esc(n.home.name)} v ${esc(n.away.name)}</div><div class="m">${tm(n.ts)} · ${esc(n.comp)}</div></div>`;
  }
  h += `<div class="sh" style="padding-top:14px"><div class="meta">${up.length} to come · ${st.length} already started</div></div>`;
  h += up.length ? `<div class="panel">${up.map(selRow).join("")}</div>` : `<div class="note"><b>ALL STARTED</b> &nbsp;Every selected game has kicked off.</div>`;
  if (st.length) {
    h += `<button class="fold ${foldOpen ? "open" : ""}" id="fold"><span>ALREADY STARTED (${st.length})</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;
    if (foldOpen) h += `<div class="panel" style="margin-top:8px">${st.map(selRow).join("")}</div>`;
  }
  return h;
}
function allView(){
  const comps = [...new Set(D.games.map(g => g.comp))].sort();
  return `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>
    <div class="sh"><h2>All games</h2><p>Every game in the next 24 hours, with its score in each section.</p></div>
    <div class="controls"><input id="q" placeholder="Search team or competition"><select id="fc"><option value="">All competitions</option>${comps.map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <select id="so"><option value="ko">Sort: kickoff</option><option value="goals">Sort: Easy Goals</option><option value="btts">Sort: Raining Goals</option></select></div>
    <div class="panel" id="allList"></div>`;
}
function allRows(){
  const q = ($("#q")?.value || "").toLowerCase(), fc = $("#fc")?.value || "", so = $("#so")?.value || "ko";
  let l = D.games.filter(g => (!fc || g.comp === fc) && (g.home.name + " " + g.away.name + " " + g.comp).toLowerCase().includes(q));
  l.sort((a, b) => so === "ko" ? a.ts - b.ts : b.sec[so].score - a.sec[so].score);
  const mini = (lab, v) => `<span class="mini" style="color:${hue(v)}"><i>${lab}</i>${v.toFixed(0)}</span>`;
  $("#allList").innerHTML = l.map(g => {
    const w = g.sec.ballon.listed ? ["BD", g.sec.ballon.score] : g.sec.misses.listed ? ["MI", g.sec.misses.score] : null;
    return `<div class="row srow" data-open="all-${g.fid}"><div class="ko">${tm(g.ts)}${now() >= g.ts ? `<small class="x">✕</small>` : ""}</div>
      <div class="mid"><div class="teams">${esc(g.home.name)}<span class="v">v</span>${esc(g.away.name)}</div>
      <div class="sub"><span class="cp">${esc(g.comp)}</span>${chips(g)}</div>
      <div class="minis">${g.sec.goals.listed ? mini("EG", g.sec.goals.score) : `<span class="mini"><i>EG</i>short</span>`}${w ? mini(w[0], w[1]) : ""}${mini("RG", g.sec.btts.score)}</div></div></div>${details(g, "all")}`;
  }).join("");
}
const SECNAME = {goals: "Easy Goals", misses: "Misses", ballon: "Ballon d'Or", btts: "Raining Goals"};
function recordView(){
  const back = `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>`;
  if (!REC) return back + `<div class="empty"><b>NO RECORD YET</b>Picks are settled the morning after they're made.</div>`;
  const rate = s => { const n = s.won + s.lost; return n ? (s.won / n * 100).toFixed(1) + "%" : "–"; };
  const card = k => { const s = REC.sections[k]; return `<div class="stat"><div class="k">${SECNAME[k]}</div><div class="v">${rate(s.d30)}</div>
    <div class="s">${s.d30.won} of ${s.d30.won + s.d30.lost} picks · last 30 days<br>All time ${rate(s.all)} (${s.all.won + s.all.lost})</div></div>`; };
  let h = back + `<div class="sh"><h2>Record</h2><p>How each section's picks have done. A pick counts once settled; void games don't count.</p></div>
    <div class="stats">${["goals", "misses", "ballon", "btts"].map(card).join("")}</div>`;
  if ((REC.check || []).length) {
    h += `<div class="sh"><h2 style="font-size:12px">Model check</h2><p>Last 90 days: does the model's confidence match what happened?</p></div>
      <div class="panel">${REC.check.map(c => `<div class="kv"><span>${esc(c.label)}</span><b>${c.forecast} forecast · ${c.actual} actual</b></div>`).join("")}</div>`;
  }
  if ((REC.recent || []).length) {
    h += `<div class="sh"><h2 style="font-size:12px">Last 7 days</h2></div>`;
    for (const d of REC.recent) {
      const day = new Intl.DateTimeFormat("en-IE", {timeZone: TZ, weekday: "long", day: "numeric", month: "long"}).format(new Date(d.date + "T12:00:00Z"));
      h += `<div class="daystr">${esc(day)}</div><div class="panel" style="margin-top:6px">` + d.picks.map(p => {
        const team = p.team ? ` · ${esc(p.team === "home" ? p.h : p.a)}` : "";
        const res = p.res === "pending" ? "Pending" : p.res === "void" ? "Void" : `${p.result[0]}–${p.result[1]} ${p.res === "won" ? "✓" : "✕"}`;
        return `<div class="cov"><div class="vb" style="color:${hue(p.score)}">${Math.round(p.score)}</div>
          <div><div class="t">${esc(p.h)} v ${esc(p.a)}</div><div class="m">${SECNAME[p.section]} #${p.rank}${team} · ${esc(p.comp)}</div></div>
          <span class="res ${p.res}">${res}</span></div>`; }).join("") + `</div>`;
    }
  }
  return h;
}
const STATUS = {covered: ["green", "Covered"], partial: ["amber", "Partly covered"], no_games: ["grey", "No games"],
  omitted_budget: ["amber", "Omitted: request limit"], blocked_plan: ["red", "Blocked"], error: ["red", "Error"],
  not_available: ["grey", "Not on free plan"]};
let covProblems = false;
function coverageView(){
  const back = `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>`;
  if (!COV) return back + `<div class="empty"><b>NO REPORT YET</b></div>`;
  const comps = COV.competitions || [], cnt = {};
  comps.forEach(c => cnt[c.status] = (cnt[c.status] || 0) + 1);
  const ran = COV.generated_utc ? new Date(COV.generated_utc).toLocaleString("en-IE", {timeZone: TZ, dateStyle: "medium", timeStyle: "short"}) : "–";
  let h = back + `<div class="sh"><h2>Coverage</h2><p>This morning's run and what the model has changed.</p></div>
    <div class="panel"><div class="kv"><span>Last run</span><b>${esc(ran)}</b></div>
    <div class="kv"><span>Games scored</span><b>${COV.games_scored ?? "–"}</b></div>
    <div class="kv"><span>Requests used · left this month</span><b>${COV.requests_used} · ${COV.monthly_remaining ?? "–"}</b></div>
    <div class="kv"><span>Competitions with games</span><b>${(cnt.covered || 0) + (cnt.partial || 0)} of ${comps.length}</b></div>
    <div class="kv"><span>Not on free plan</span><b>${cnt.not_available || 0}</b></div>
    <div class="kv"><span>Problems</span><b>${(cnt.omitted_budget || 0) + (cnt.blocked_plan || 0) + (cnt.error || 0)}</b></div>
    <div class="kv"><span>Dropped: postponed / already started</span><b>${COV.dropped_postponed ?? 0} / ${COV.dropped_started ?? 0}</b></div>
    ${COV.last_error ? `<div class="kv"><span>Last error</span><b style="color:var(--red)">${esc(COV.last_error)}</b></div>` : ""}</div>`;
  const md = COV.model || {};
  if ((md.changes || []).length) {
    h += `<div class="sh"><h2 style="font-size:12px">Model adjustments</h2><p>What the daily analysis changed. Recent form counts ${Math.round((md.form_weight || 0) * 100)}%; older games fade with a ${md.half_life} day half-life.</p></div>
      <div class="panel">${md.changes.map(c => `<div class="log">${esc(c.text)}<small>${esc(c.date)}</small></div>`).join("")}</div>`;
  }
  h += `<div class="sh"><h2 style="font-size:12px">Competitions</h2></div>
    <div class="subtabs"><button data-cv="all" class="${covProblems ? "" : "on"}">All ${comps.length}</button><button data-cv="prob" class="${covProblems ? "on" : ""}">Problems only</button></div><div class="panel">`;
  for (const c of comps) {
    if (covProblems && ["covered", "no_games", "not_available"].includes(c.status)) continue;
    const [cls, label] = STATUS[c.status] || ["grey", c.status];
    const detail = c.status === "covered" || c.status === "partial" ? `${c.games} game${c.games === 1 ? "" : "s"}` : "";
    h += `<div class="cov"><div class="vb">${c.value}</div><div><div class="t">${esc(c.name)}${c.newly_found ? ` <span class="chip green">New</span>` : ""}</div>
      <div class="m">${c.note ? esc(c.note) : (c.matched || []).map(m => esc(m.name)).join(", ")}</div></div>
      <div style="text-align:right"><span class="chip ${cls}">${label}</span>${detail ? `<div class="m">${detail}</div>` : ""}</div></div>`;
  }
  return h + `</div>`;
}
function howView(){
  return `<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>BACK</button>
    <div class="sh"><h2>How it works</h2></div><div class="panel prose">
    <h3>The score</h3>Every pick gets a score from 1 to 100 for how unlikely it is to go wrong, on its own section's scale. It isn't a percentage. A game becomes a pick at ${D.min_club} or above (${D.min_intl} for internationals), up to ${D.top_n} per section. Fewer qualify on some days, and lists are never padded. Next best shows the rest.
    <h3>Easy Goals</h3>Goes wrong on a 0-0. Games more than ${Math.round(D.goals_max * 100)}% likely to have a goal are too short to be picks; a game right at ${Math.round(D.goals_max * 100)}% scores 100.
    <h3>Misses and Ballon d'Or</h3>A game goes on only one of the two. Ballon d'Or takes clear favourites (${Math.round(D.ballon_min * 100)}% or more to win). Every other game with an underdog no longer than ${D.misses_longest}/1 can go in Misses, where a 3/1 underdog scores about 50 and a ${D.misses_longest}/1 underdog 100.
    <h3>Raining Goals</h3>Goes wrong if either team fails to score.
    <h3>Team strength</h3>Attack and defence ratings come from every result, adjusted for the opponent and the league, and update every morning. Recent form counts a little extra. National teams use three years of internationals.
    <h3>Learning from results</h3>Every prediction is stored and checked against what happened. Each morning, settings are nudged where the evidence shows the forecasts are off, separately for clubs and internationals. Changes are listed on the Coverage screen.
    <h3>All games</h3>Each game shows its score in every section: EG = Easy Goals, BD = Ballon d'Or, MI = Misses, RG = Raining Goals.
    <h3>Reality check</h3>Scores are a ranking, not a guarantee. At short prices one losing pick can wipe out many winners. The Record screen shows how each section is really doing.</div>`;
}
function banners(){
  const b = [];
  if (D) {
    if (Date.now() - Date.parse(D.generated_utc) > 26 * 3600 * 1000)
      b.push(`<div class="banner stale"><b>OUT OF DATE</b> &nbsp;This list was made ${esc(new Date(D.generated_utc).toLocaleString("en-IE", {timeZone: TZ, dateStyle: "medium", timeStyle: "short"}))}. This morning's update may have failed.</div>`);
    if ((D.new_competitions || []).length)
      b.push(`<div class="banner new"><b>NEW ON OPENFOOTAPI</b> &nbsp;${D.new_competitions.map(esc).join(", ")} now included automatically.</div>`);
  }
  if (COV && COV.last_error) b.push(`<div class="banner stale"><b>UPDATE PROBLEM</b> &nbsp;${esc(COV.last_error)}</div>`);
  $("#banners").innerHTML = b.join("");
}

/* ---------- wiring ---------- */
let tab = "selected", page = null;
function render(){
  const m = $("#main");
  if (!D) { m.innerHTML = `<div class="empty"><b>NO DATA YET</b>The first morning run hasn't finished. Run it from GitHub's Actions tab.</div>`; return; }
  if (page === "all") { m.innerHTML = allView(); allRows(); }
  else if (page === "record") m.innerHTML = recordView();
  else if (page === "coverage") m.innerHTML = coverageView();
  else if (page === "how") m.innerHTML = howView();
  else m.innerHTML = tab === "selected" ? selectedView() : sectionView(tab);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", !page && b.dataset.tab === tab));
  tick();
}
function tick(){
  const el = $("#cd"); if (!el) return;
  const up = selectedGames().filter(x => x.g.ts > now());
  if (!up.length) return;
  let s = Math.max(0, Math.round(up[0].g.ts - now()));
  const days = Math.floor(s / 86400); s -= days * 86400;
  const hh = String(Math.floor(s / 3600)).padStart(2, "0"), mm = String(Math.floor(s % 3600 / 60)).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
  el.textContent = `${days ? days + "d " : ""}${hh}:${mm}:${ss}`;
}
setInterval(tick, 1000);
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; page = null; window.scrollTo(0, 0); render(); });
const menu = on => { $("#sheet").classList.toggle("on", on); $("#scrim").classList.toggle("on", on); };
$("#menuBtn").onclick = () => menu(!$("#sheet").classList.contains("on"));
$("#scrim").onclick = () => menu(false);
$("#sheet").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; page = b.dataset.go; menu(false); window.scrollTo(0, 0); render(); });
document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) { page = null; render(); return; }
  if (e.target.closest("#fold")) { foldOpen = !foldOpen; render(); return; }
  const cv = e.target.closest("[data-cv]"); if (cv) { covProblems = cv.dataset.cv === "prob"; render(); return; }
  const nb = e.target.closest("[data-next]"); if (nb) { nextOpen[nb.dataset.next] = !nextOpen[nb.dataset.next]; render(); return; }
  const r = e.target.closest("[data-open]");
  if (r) { const d = document.querySelector(`[data-det="${CSS.escape(r.dataset.open)}"]`);
    if (d) { d.classList.toggle("open"); d.classList.contains("open") ? OPEN.add(r.dataset.open) : OPEN.delete(r.dataset.open); } }
});
document.addEventListener("input", e => { if (e.target.id === "q") allRows(); });
document.addEventListener("change", e => { if (e.target.id === "fc" || e.target.id === "so") allRows(); });
setInterval(() => { if (!page || page === "all") { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 60000);
(async function start(){
  [D, COV, REC] = await Promise.all([getJSON("today.json"), getJSON("coverage.json"), getJSON("record.json")]);
  banners();
  render();
})();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
