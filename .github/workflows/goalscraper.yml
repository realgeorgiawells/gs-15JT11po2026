name: Goalscraper daily

# Runs at 6:15 am Irish time every day, all year round.
# GitHub's clock is UTC, so it is woken at both 05:15 and 06:15 UTC and only the one that
# matches 6:15 in Ireland (summer or winter time) does any work. GitHub can start a few minutes late.
on:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: goalscraper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ran: ${{ steps.build.outputs.ran }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Results saved by earlier runs, so only the last few days are fetched
      - name: Restore saved results
        uses: actions/cache/restore@v4
        with:
          path: data/store.json
          key: results-${{ github.run_id }}
          restore-keys: results-

      - name: Build today's list
        id: build
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: python goalscraper.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save results for tomorrow
        if: always() && hashFiles('data/store.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/store.json
          key: results-${{ github.run_id }}

      - name: Save tracking history
        if: always() && steps.build.outputs.ran == 'true'
        run: |
          git config user.name "goalscraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data 
          if ! git diff --cached --quiet; then
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Package the app
        if: always() && steps.build.outputs.ran == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: always() && needs.build.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
