name: One-off data check
on:
  workflow_dispatch:
    inputs:
      competition: {description: "OpenFootAPI competition id", default: "comp_brasileirao_bra"}
      season: {description: "Season", default: "2026"}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: python tools/check_comp.py "${{ inputs.competition }}" "${{ inputs.season }}"
